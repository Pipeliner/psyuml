<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PsyUML</title>
    <style>
      /* Pre-bundle baseline so the first paint already has WCAG 2.2 visible focus
         (2.4.7) and a sane background; the full design system lives in styles.css
         (loaded by main.tsx, ADR-0013). */
      body {
        margin: 0;
        background: #f4f6f8;
      }
      :focus-visible {
        outline: 3px solid #0072b2;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
