<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-label="Schema mode map: Schema modes. Modes by dominance: Punitive Parent 0.60, Vulnerable Child 0.80, Detached Protector 0.70, Healthy Adult 0.30. Triggers: Punitive Parent (attacks) -&gt; Vulnerable Child; Vulnerable Child (activates) -&gt; Detached Protector; Healthy Adult (nurtures) -&gt; Vulnerable Child. Goal: grow the Healthy Adult."><title>Schema modes</title><desc>Schema mode map: Schema modes. Modes by dominance: Punitive Parent 0.60, Vulnerable Child 0.80, Detached Protector 0.70, Healthy Adult 0.30. Triggers: Punitive Parent (attacks) -&gt; Vulnerable Child; Vulnerable Child (activates) -&gt; Detached Protector; Healthy Adult (nurtures) -&gt; Vulnerable Child. Goal: grow the Healthy Adult.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="560" height="480" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">Schema modes</text><path data-el="edge:m1" d="M 200,104.8 L 200,189.6" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" /><text data-el="edgelabel:m1" x="200" y="144.2" text-anchor="middle" font-family="sans-serif" font-size="9" stroke="#fff" stroke-width="3" paint-order="stroke">attacks</text><path data-el="edge:m2" d="M 238.3,217.2 L 404.3,161.9" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" /><text data-el="edgelabel:m2" x="321.3" y="186.6" text-anchor="middle" font-family="sans-serif" font-size="9" stroke="#fff" stroke-width="3" paint-order="stroke">activates</text><path data-el="edge:m3" d="M 415.3,310.7 L 237.8,244.2" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" /><text data-el="edgelabel:m3" x="326.6" y="274.5" text-anchor="middle" font-family="sans-serif" font-size="9" stroke="#fff" stroke-width="3" paint-order="stroke">nurtures</text><circle data-el="node:punitive" cx="200" cy="70" r="34.8" fill="#fff" stroke="#000" stroke-width="2" /><text x="200" y="118.8" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:punitive">Punitive Parent</text><text data-el="nodelabel:punitive" x="200" y="132.8" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">dom 0.60</text><circle data-el="node:vchild" cx="200" cy="230" r="40.4" fill="#fff" stroke="#000" stroke-width="2" /><polygon points="200,176.6 208,188.6 192,188.6" fill="#fff" stroke="#000" stroke-width="1.5" /><text x="200" y="284.4" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:vchild">Vulnerable Child</text><text data-el="nodelabel:vchild" x="200" y="298.4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">dom 0.80</text><circle data-el="node:detached" cx="440" cy="150" r="37.6" fill="#fff" stroke="#000" stroke-width="2" /><text x="440" y="201.6" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:detached">Detached Protector</text><text data-el="nodelabel:detached" x="440" y="215.6" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">dom 0.70</text><circle data-el="node:healthy" cx="440" cy="320" r="26.4" fill="#fff" stroke="#000" stroke-width="2" /><circle cx="440" cy="320" r="22.4" fill="none" stroke="#000" stroke-width="2" /><text x="440" y="287.6" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">↑ grow</text><text x="440" y="360.4" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:healthy">Healthy Adult</text><text data-el="nodelabel:healthy" x="440" y="374.4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">dom 0.30</text><text x="12" y="456" font-family="sans-serif" font-size="10" textLength="540" lengthAdjust="spacingAndGlyphs">Circle size = mode dominance (number shown). Goal: grow the Healthy Adult, shrink maladaptive modes.</text><text x="12" y="470" font-family="sans-serif" font-size="9" fill="#333">This map supports, and does not replace, professional care.</text></svg>