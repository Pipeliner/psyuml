<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-label="Two overlapping circles: States of mind (DBT) — full showcase. Left — Reasonable Mind (facts, logic, planning); overlap (what both share) — Wise Mind (both honoured, values-guided action); right — Emotion Mind (feelings, urges, mood-driven)."><title>States of mind (DBT) — full showcase</title><desc>Two overlapping circles: States of mind (DBT) — full showcase. Left — Reasonable Mind (facts, logic, planning); overlap (what both share) — Wise Mind (both honoured, values-guided action); right — Emotion Mind (feelings, urges, mood-driven).</desc><rect x="0" y="0" width="600" height="470" fill="#fff" /><text x="20" y="24" font-family="sans-serif" font-size="16" font-weight="700">States of mind (DBT) — full showcase</text><circle cx="230" cy="245" r="140" fill="none" stroke="#000" stroke-width="2" /><circle cx="370" cy="245" r="140" fill="none" stroke="#000" stroke-width="2" /><text data-el="nodelabel:reason" x="160" y="241" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Reasonable Mind</text><text x="160" y="260" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="2.5" paint-order="stroke" textLength="128" lengthAdjust="spacingAndGlyphs">facts, logic · planning</text><text data-el="nodelabel:wise" x="300" y="241" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Wise Mind</text><text x="300" y="260" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="2.5" paint-order="stroke" textLength="128" lengthAdjust="spacingAndGlyphs">both honoured · values-guided action</text><text data-el="nodelabel:emotion" x="440" y="241" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Emotion Mind</text><text x="440" y="260" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#333" stroke="#fff" stroke-width="2.5" paint-order="stroke" textLength="128" lengthAdjust="spacingAndGlyphs">feelings, urges · mood-driven</text><text x="20" y="444" font-family="sans-serif" font-size="11">Two circles, one overlap: the middle region is what both share.</text><text x="20" y="460" font-family="sans-serif" font-size="10" fill="#333" textLength="572" lengthAdjust="spacingAndGlyphs">This map supports, and does not replace, professional care. &quot;Wise Mind&quot; is a teaching idea, not a measurable state.</text></svg>