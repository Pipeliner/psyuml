<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 0 752 594" role="img" aria-label="Crisis navigation chart: If I'm not OK — what to do. Start: &quot;Am I safe right now?&quot;. Steps: from &quot;Am I safe right now?&quot;, if No / unsafe go to &quot;Call/text a crisis line or emergency&quot;; from &quot;Am I safe right now?&quot;, if Yes go to &quot;What do I feel?&quot;; from &quot;What do I feel?&quot;, if Revved up go to &quot;TIPP / cold water / breathe&quot;; from &quot;What do I feel?&quot;, if Shut down go to &quot;Move / orient / reach support&quot;; from &quot;TIPP / cold water / breathe&quot;, go to &quot;Still stuck after 15 min?&quot;; from &quot;Move / orient / reach support&quot;, go to &quot;Still stuck after 15 min?&quot;; from &quot;Still stuck after 15 min?&quot;, if Yes go to &quot;Call my support person&quot;; from &quot;Still stuck after 15 min?&quot;, if No go to &quot;Back in my window — OK for now&quot;. Crisis resources are always shown: If you are in danger now, call your local emergency number or a crisis line (use your local number)."><title>If I'm not OK — what to do</title><desc>Crisis navigation chart: If I'm not OK — what to do. Start: &quot;Am I safe right now?&quot;. Steps: from &quot;Am I safe right now?&quot;, if No / unsafe go to &quot;Call/text a crisis line or emergency&quot;; from &quot;Am I safe right now?&quot;, if Yes go to &quot;What do I feel?&quot;; from &quot;What do I feel?&quot;, if Revved up go to &quot;TIPP / cold water / breathe&quot;; from &quot;What do I feel?&quot;, if Shut down go to &quot;Move / orient / reach support&quot;; from &quot;TIPP / cold water / breathe&quot;, go to &quot;Still stuck after 15 min?&quot;; from &quot;Move / orient / reach support&quot;, go to &quot;Still stuck after 15 min?&quot;; from &quot;Still stuck after 15 min?&quot;, if Yes go to &quot;Call my support person&quot;; from &quot;Still stuck after 15 min?&quot;, if No go to &quot;Back in my window — OK for now&quot;. Crisis resources are always shown: If you are in danger now, call your local emergency number or a crisis line (use your local number).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="-16" y="0" width="752" height="594" fill="#fff" /><text x="20" y="22" font-family="sans-serif" font-size="16" font-weight="700">If I'm not OK — what to do</text><path data-el="edge:e1" d="M 301,89 L 175.5,135" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e2" d="M 301,89 L 426.5,135" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e3" d="M 426.5,185 L 303.5,258" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e4" d="M 426.5,185 L 549.5,258" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e5" d="M 303.5,308 L 426.5,354" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e6" d="M 549.5,308 L 426.5,354" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e7" d="M 426.5,404 L 303.5,450" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e8" d="M 426.5,404 L 549.5,450" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="209" y="116" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="3.5" paint-order="stroke" data-el="edgelabel:e1">No / unsafe</text><text x="393" y="116" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="3.5" paint-order="stroke" data-el="edgelabel:e2">Yes</text><text x="334.5" y="225.5" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="3.5" paint-order="stroke" data-el="edgelabel:e3">Revved up</text><text x="518.5" y="225.5" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="3.5" paint-order="stroke" data-el="edgelabel:e4">Shut down</text><text x="334.5" y="431" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="3.5" paint-order="stroke" data-el="edgelabel:e7">Yes</text><text x="518.5" y="431" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="3.5" paint-order="stroke" data-el="edgelabel:e8">No</text><polygon data-el="node:q_safe" points="301,39 406,64 301,89 196,64" fill="#fff" stroke="#000" stroke-width="2" /><text x="301" y="68" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:q_safe">Am I safe right now?</text><polygon data-el="node:q_feel" points="426.5,135 531.5,160 426.5,185 321.5,160" fill="#fff" stroke="#000" stroke-width="2" /><text x="426.5" y="164" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:q_feel">What do I feel?</text><rect data-el="node:crisis" x="70.5" y="135" width="210" height="50" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="3.5" /><text text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" data-el="nodelabel:crisis"><tspan x="175.5" y="157">! Call/text a crisis line or</tspan><tspan x="175.5" y="171">emergency</tspan></text><text text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333" data-el="nodelabel:crisis"><tspan x="175.5" y="198">If you are in danger now, call your local</tspan><tspan x="175.5" y="210">emergency number or a crisis line (use</tspan><tspan x="175.5" y="222">your local number).</tspan></text><rect data-el="node:revved" x="198.5" y="258" width="210" height="50" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="303.5" y="287" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:revved">TIPP / cold water / breathe</text><rect data-el="node:shutdown" x="444.5" y="258" width="210" height="50" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="549.5" y="287" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:shutdown">Move / orient / reach support</text><polygon data-el="node:q_stuck" points="426.5,354 531.5,379 426.5,404 321.5,379" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:q_stuck"><tspan x="426.5" y="376">Still stuck after 15</tspan><tspan x="426.5" y="390">min?</tspan></text><rect data-el="node:safe_back" x="444.5" y="450" width="210" height="50" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:safe_back"><tspan x="549.5" y="472">Back in my window — OK for</tspan><tspan x="549.5" y="486">now</tspan></text><rect data-el="node:support" x="198.5" y="450" width="210" height="50" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="303.5" y="479" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:support">Call my support person</text><rect data-el="banner:crisis" x="0" y="516" width="720" height="48" fill="#fff" stroke="#000" stroke-width="2" /><text x="14" y="535" font-family="sans-serif" font-size="12" font-weight="700">Crisis resources (always available):</text><text x="14" y="553" font-family="sans-serif" font-size="11">If you are in danger now, call your local emergency number or a crisis line (use your local number).</text><text x="14" y="578" font-family="sans-serif" font-size="10" fill="#333">This chart supports, and does not replace, professional care. It does not diagnose.</text></svg>