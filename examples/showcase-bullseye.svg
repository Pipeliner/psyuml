<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" role="img" aria-label="Values bull's-eye: Values bull's-eye — full showcase. Centre = on target, rim = off target. Domains: Family &amp; intimacy — on target (90); Friendships &amp; community — drifting (60); Work / education — drifting (45); Health &amp; self-care — off target (15); Recreation &amp; play — off target (30); Personal growth &amp; spirituality — drifting (55)."><title>Values bull's-eye — full showcase</title><desc>Values bull's-eye: Values bull's-eye — full showcase. Centre = on target, rim = off target. Domains: Family &amp; intimacy — on target (90); Friendships &amp; community — drifting (60); Work / education — drifting (45); Health &amp; self-care — off target (15); Recreation &amp; play — off target (30); Personal growth &amp; spirituality — drifting (55).</desc><rect x="0" y="0" width="640" height="476" fill="#fff" /><text x="20" y="24" font-family="sans-serif" font-size="16" font-weight="700">Values bull's-eye — full showcase</text><circle cx="325" cy="252" r="148" fill="none" stroke="#000" stroke-width="2" /><circle cx="325" cy="252" r="106.6" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.4" /><circle cx="325" cy="252" r="68.1" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.4" /><circle cx="325" cy="252" r="32.6" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.4" /><circle cx="325" cy="252" r="3" fill="#000" /><line x1="325" y1="213.8" x2="325" y2="102" stroke="#000" stroke-width="1" stroke-opacity="0.35" /><circle data-el="node:family" cx="325" cy="213.8" r="5" fill="#000" /><text x="325" y="92" font-family="sans-serif" font-size="12" text-anchor="middle" data-el="nodelabel:family">Family &amp; intimacy</text><line x1="389.8" y1="214.6" x2="454.9" y2="177" stroke="#000" stroke-width="1" stroke-opacity="0.35" /><circle data-el="node:friends" cx="389.8" cy="214.6" r="5" fill="#000" /><text x="467" y="174" font-family="sans-serif" font-size="12" text-anchor="start" data-el="nodelabel:friends" textLength="150" lengthAdjust="spacingAndGlyphs">Friendships &amp; community</text><line x1="405.6" y1="298.6" x2="454.9" y2="327" stroke="#000" stroke-width="1" stroke-opacity="0.35" /><circle data-el="node:work" cx="405.6" cy="298.6" r="5" fill="#000" /><text x="467" y="338" font-family="sans-serif" font-size="12" text-anchor="start" data-el="nodelabel:work">Work / education</text><line x1="325" y1="381.7" x2="325" y2="402" stroke="#000" stroke-width="1" stroke-opacity="0.35" /><circle data-el="node:health" cx="325" cy="381.7" r="5" fill="#000" /><text x="325" y="420" font-family="sans-serif" font-size="12" text-anchor="middle" data-el="nodelabel:health">Health &amp; self-care</text><line x1="228.5" y1="307.7" x2="195.1" y2="327" stroke="#000" stroke-width="1" stroke-opacity="0.35" /><circle data-el="node:leisure" cx="228.5" cy="307.7" r="5" fill="#000" /><text x="183" y="338" font-family="sans-serif" font-size="12" text-anchor="end" data-el="nodelabel:leisure">Recreation &amp; play</text><line x1="254.9" y1="211.6" x2="195.1" y2="177" stroke="#000" stroke-width="1" stroke-opacity="0.35" /><circle data-el="node:growth" cx="254.9" cy="211.6" r="5" fill="#000" /><text x="183" y="174" font-family="sans-serif" font-size="8.5" text-anchor="end" data-el="nodelabel:growth">Personal growth &amp; spirituality</text><text x="20" y="448" font-family="sans-serif" font-size="11">Each dot is a life area; closer to the centre = living more like that value matters to you.</text><text x="20" y="464" font-family="sans-serif" font-size="10" fill="#333">ACT values-clarification reflection (Lundgren) — a teaching aid, not a measure of a good or bad life.</text></svg>