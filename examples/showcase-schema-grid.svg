<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 496" role="img" aria-label="Schema-domains grid: Schema domains — Young's 18 (full showcase). Young's 18 schemas in 5 domains; outline weight and a bar show each schema's intensity, bold cells are active for this person. Disconnection &amp; Rejection — Abandonment / Instability, Mistrust / Abuse (active, intensity 0.7), Emotional Deprivation (active, intensity 0.8), Defectiveness / Shame, Social Isolation; Impaired Autonomy &amp; Performance — Dependence / Incompetence, Vulnerability to Harm, Enmeshment / Undeveloped Self, Failure (active, intensity 0.6); Impaired Limits — Entitlement / Grandiosity, Insufficient Self-Control; Other-Directedness — Subjugation (active, intensity 0.7), Self-Sacrifice, Approval-Seeking; Overvigilance &amp; Inhibition — Negativity / Pessimism, Emotional Inhibition, Unrelenting Standards (active, intensity 0.75), Punitiveness."><title>Schema domains — Young's 18 (full showcase)</title><desc>Schema-domains grid: Schema domains — Young's 18 (full showcase). Young's 18 schemas in 5 domains; outline weight and a bar show each schema's intensity, bold cells are active for this person. Disconnection &amp; Rejection — Abandonment / Instability, Mistrust / Abuse (active, intensity 0.7), Emotional Deprivation (active, intensity 0.8), Defectiveness / Shame, Social Isolation; Impaired Autonomy &amp; Performance — Dependence / Incompetence, Vulnerability to Harm, Enmeshment / Undeveloped Self, Failure (active, intensity 0.6); Impaired Limits — Entitlement / Grandiosity, Insufficient Self-Control; Other-Directedness — Subjugation (active, intensity 0.7), Self-Sacrifice, Approval-Seeking; Overvigilance &amp; Inhibition — Negativity / Pessimism, Emotional Inhibition, Unrelenting Standards (active, intensity 0.75), Punitiveness.</desc><rect x="0" y="0" width="880" height="496" fill="#fff" /><text x="16" y="26" font-family="sans-serif" font-size="16" font-weight="700">Schema domains — Young's 18 (fu