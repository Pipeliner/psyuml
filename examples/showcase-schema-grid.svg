.7</text><text x="612" y="127" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700" data-el="nodelabel:su">Subjugation</text><rect data-el="node:ss" x="532" y="170" width="160" height="62" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="1.3" /><text x="612" y="201" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="400" data-el="nodelabel:ss">Self-Sacrifice</text><rect data-el="node:as" x="532" y="240" width="160" height="62" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="1.3" /><text x="612" y="271" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="400" data-el="nodelabel:as">Approval-Seeking</text><rect x="704" y="42" width="160" height="48" rx="6" ry="6" fill="#eceff3" stroke="#8a93a3" stroke-width="1.2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2a2f3a"><tspan x="784" y="59">Overvigilance &amp;</tspan><tspan x="784" y="73">Inhibition</tspan></text><rect data-el="node:np" x="704" y="100" width="160" height="62" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="1.3" /><text x="784" y="131" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="400" data-el="nodelabel:np">Negativity / Pessimism</text><rect data-el="node:ei" x="704" y="170" width="160" height="62" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="1.3" /><text x="784" y="201" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="400" data-el="nodelabel:ei">Emotional Inhibition</text><rect data-el="node:us" x="704" y="240" width="160" height="62" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="3" /><path data-active="us" d="M704 254 L704 240 L718 240 Z" fill="#000" /><rect data-meter-track="us" x="714" y="288" width="110" height="6" fill="#fff" stroke="#000" stroke-width="0.8" /><rect data-meter="us" x="714" y="288" width="82.5" height="6" fill="#000" /><text data-intensity-value="us" x="854" y="294" text-anchor="end" font-family="sans-serif" font-size="10">0.75</text><text x="784" y="267" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700" data-el="nodelabel:us">Unrelenting Standards</text><rect data-el="node:pu" x="704" y="310" width="160" height="62" rx="6" ry="6" fill="#fff" stroke="#000" stroke-width="1.3" /><text x="784" y="341" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="400" data-el="nodelabel:pu">Punitiveness</text><text x="16" y="460" font-family="sans-serif" font-size="11">Columns: Young's 5 schema domains. Outline weight and bar = intensity (number shown); wedge (▟) + bold name = active (≥ 0.5).</text><text x="16" y="476" font-family="sans-serif" font-size="10" fill="#333" textLength="856" lengthAdjust="spacingAndGlyphs">Young's 18 Early Maladaptive Schemas in 5 domains — a psychoeducation map, not a diagnosis; schema labels are validated, the layout is a teaching convention.</text></svg>