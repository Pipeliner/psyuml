<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" role="img" aria-label="Intervention sequence: DBT chain analysis. Lanes: The chain, Skills / way out. Steps in order: Vulnerability: tired, hungry, lonely (The chain) → Prompting event: a critical text (The chain) → Thought: &quot;I'm rejected&quot; (The chain) → Emotion + urge: shame, to self-harm (The chain) → Problem behaviour (The chain) → Skill: opposite action, TIPP, ride the urge (Skills / way out)."><title>DBT chain analysis</title><desc>Intervention sequence: DBT chain analysis. Lanes: The chain, Skills / way out. Steps in order: Vulnerability: tired, hungry, lonely (The chain) → Prompting event: a critical text (The chain) → Thought: &quot;I'm rejected&quot; (The chain) → Emotion + urge: shame, to self-harm (The chain) → Problem behaviour (The chain) → Skill: opposite action, TIPP, ride the urge (Skills / way out).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="720" height="466" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">DBT chain analysis</text><text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">The chain</text><text x="540" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Skills / way out</text><line x1="360" y1="38" x2="360" y2="456" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" /><path data-el="edge:e1" d="M 180,95 L 180,129" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e2" d="M 180,175 L 180,209" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e3" d="M 180,255 L 180,289" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e4" d="M 180,335 L 180,369" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:x1" d="M 180,335 L 540,369" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="364" y="352" font-family="sans-serif" font-size="10" data-el="edgelabel:x1">interrupt here</text><polygon data-el="node:vuln" points="114,49 246,49 258,72 246,95 114,95 102,72" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:vuln"><tspan x="180" y="69.5">Vulnerability: tired,</tspan><tspan x="180" y="82.5">hungry, lonely</tspan></text><polygon data-el="node:prompt" points="114,129 246,129 258,152 246,175 114,175 102,152" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:prompt"><tspan x="180" y="149.5">Prompting event: a</tspan><tspan x="180" y="162.5">critical text</tspan></text><polygon data-el="node:thought" points="114,209 246,209 258,232 246,255 114,255 102,232" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:thought"><tspan x="180" y="229.5">Thought: &quot;I'm</tspan><tspan x="180" y="242.5">rejected&quot;</tspan></text><polygon data-el="node:urge" points="114,289 246,289 258,312 246,335 114,335 102,312" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:urge"><tspan x="180" y="309.5">Emotion + urge: shame,</tspan><tspan x="180" y="322.5">to self-harm</tspan></text><polygon data-el="node:behaviour" points="114,369 246,369 258,392 246,415 114,415 102,392" fill="#fff" stroke="#000" stroke-width="2" /><text x="180" y="396" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:behaviour">Problem behaviour</text><polygon data-el="node:skill" points="474,369 606,369 618,392 606,415 474,415 462,392" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:skill"><tspan x="540" y="389.5">Skill: opposite</tspan><tspan x="540" y="402.5" textLength="128" lengthAdjust="spacingAndGlyphs">action, TIPP, ride the urge</tspan></text></svg>