<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-label="Intervention sequence: DBT chain analysis. Lanes: The chain, Skills / way out. Steps in order: Vulnerability: tired, hungry, lonely (The chain) → Prompting event: a critical text (The chain) → Thought: &quot;I'm rejected&quot; (The chain) → Emotion + urge: shame, to self-harm (The chain) → Problem behaviour (The chain) → Skill: opposite action, TIPP, ride the urge (Skills / way out)."><title>DBT chain analysis</title><desc>Intervention sequence: DBT chain analysis. Lanes: The chain, Skills / way out. Steps in order: Vulnerability: tired, hungry, lonely (The chain) → Prompting event: a critical text (The chain) → Thought: &quot;I'm rejected&quot; (The chain) → Emotion + urge: shame, to self-harm (The chain) → Problem behaviour (The chain) → Skill: opposite action, TIPP, ride the urge (Skills / way out).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="720" height="490" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">DBT chain analysis</text><text x="180" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">The chain</text><text x="540" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Skills / way out</text><line x1="360" y1="62" x2="360" y2="480" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" /><path data-el="edge:e1" d="M 180,119 L 180,153" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e2" d="M 180,199 L 180,233" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e3" d="M 180,279 L 180,313" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e4" d="M 180,359 L 180,393" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:x1" d="M 180,359 L 540,393" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="364" y="376" font-family="sans-serif" font-size="10" data-el="edgelabel:x1">interrupt here</text><polygon data-el="node:vuln" points="114,73 246,73 258,96 246,119 114,119 102,96" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:vuln"><tspan x="180" y="93.5">Vulnerability: tired,</tspan><tspan x="180" y="106.5">hungry, lonely</tspan></text><polygon data-el="node:prompt" points="114,153 246,153 258,176 246,199 114,199 102,176" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:prompt"><tspan x="180" y="173.5">Prompting event: a</tspan><tspan x="180" y="186.5">critical text</tspan></text><polygon data-el="node:thought" points="114,233 246,233 258,256 246,279 114,279 102,256" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:thought"><tspan x="180" y="253.5">Thought: &quot;I'm</tspan><tspan x="180" y="266.5">rejected&quot;</tspan></text><polygon data-el="node:urge" points="114,313 246,313 258,336 246,359 114,359 102,336" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:urge"><tspan x="180" y="333.5">Emotion + urge: shame,</tspan><tspan x="180" y="346.5">to self-harm</tspan></text><polygon data-el="node:behaviour" points="114,393 246,393 258,416 246,439 114,439 102,416" fill="#fff" stroke="#000" stroke-width="2" /><text x="180" y="420" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:behaviour">Problem behaviour</text><polygon data-el="node:skill" points="474,393 606,393 618,416 606,439 474,439 462,416" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:skill"><tspan x="540" y="413.5">Skill: opposite</tspan><tspan x="540" y="426.5" textLength="128" lengthAdjust="spacingAndGlyphs">action, TIPP, ride the urge</tspan></text></svg>