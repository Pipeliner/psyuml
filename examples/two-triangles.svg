<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 849 389" role="img" aria-label="Two triangles: Two triangles — defended grief. Triangle of Conflict — Defence: withdraw &amp; placate, Anxiety: fear of rejection, Hidden feeling: anger &amp; grief. Triangle of Person — Current: partner, Therapist (here &amp; now), Past: critical parent. Transference links the same conflict across relationships."><title>Two triangles — defended grief</title><desc>Two triangles: Two triangles — defended grief. Triangle of Conflict — Defence: withdraw &amp; placate, Anxiety: fear of rejection, Hidden feeling: anger &amp; grief. Triangle of Person — Current: partner, Therapist (here &amp; now), Past: critical parent. Transference links the same conflict across relationships.</desc><rect x="0" y="0" width="849" height="389" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">Two triangles — defended grief</text><line data-el="edge:f_a" x1="228.2" y1="279.9" x2="326.8" y2="125.1" stroke="#000" stroke-width="1.5" /><text data-el="edgelabel:f_a" x="277.5" y="199.5" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">stirs</text><line data-el="edge:a_d" x1="324" y1="120" x2="126" y2="120" stroke="#000" stroke-width="1.5" /><text data-el="edgelabel:a_d" x="225" y="117" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">triggers</text><line data-el="edge:d_f" x1="123.2" y1="125.1" x2="221.8" y2="279.9" stroke="#000" stroke-width="1.5" /><text data-el="edgelabel:d_f" x="172.5" y="199.5" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">hides</text><line data-el="edge:p_c" x1="641.8" y1="279.9" x2="543.2" y2="125.1" stroke="#000" stroke-width="1.5" stroke-dasharray="2 4" /><text data-el="edgelabel:p_c" x="592.5" y="199.5" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">repeats with</text><line data-el="edge:p_t" x1="648.2" y1="279.9" x2="746.8" y2="125.1" stroke="#000" stroke-width="1.5" stroke-dasharray="2 4" /><text data-el="edgelabel:p_t" x="697.5" y="199.5" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">repeats with</text><line data-el="edge:c_t" x1="546" y1="120" x2="744" y2="120" stroke="#000" stroke-width="1.5" stroke-dasharray="2 4" /><line data-el="edge:f_p" x1="231" y1="285" x2="639" y2="285" stroke="#000" stroke-width="1.5" stroke-dasharray="2 4" /><text data-el="edgelabel:f_p" x="435" y="282" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">enacted in</text><text x="225" y="92" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Triangle of Conflict</text><text x="645" y="92" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Triangle of Person</text><rect data-el="node:defence" x="41" y="101" width="158" height="38" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:defence"><tspan x="120" y="117.5">Defence: withdraw &amp;</tspan><tspan x="120" y="130.5">placate</tspan></text><rect data-el="node:anxiety" x="251" y="101" width="158" height="38" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:anxiety"><tspan x="330" y="117.5">Anxiety: fear of</tspan><tspan x="330" y="130.5">rejection</tspan></text><rect data-el="node:feeling" x="146" y="266" width="158" height="38" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:feeling"><tspan x="225" y="282.5">Hidden feeling: anger &amp;</tspan><tspan x="225" y="295.5">grief</tspan></text><rect data-el="node:current" x="461" y="101" width="158" height="38" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="540" y="124" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:current">Current: partner</text><rect data-el="node:transf" x="671" y="101" width="158" height="38" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="750" y="124" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:transf">Therapist (here &amp; now)</text><rect data-el="node:past" x="566" y="266" width="158" height="38" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="645" y="289" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:past">Past: critical parent</text><text x="12" y="377" font-family="sans-serif" font-size="10">solid = within-triangle link · dotted = transference (same conflict, new relationship)</text></svg>