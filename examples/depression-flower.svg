<svg xmlns="http://www.w3.org/2000/svg" viewBox="68.4 52 423.2 343.2" role="img" aria-label="Maintaining loop: Low mood — a maintaining cycle (vicious flower). Links: &quot;I'm worthless / a failure&quot; -&gt; Withdraw, stop activities; Withdraw, stop activities -&gt; Fewer good experiences; Fewer good experiences -&gt; &quot;I'm worthless / a failure&quot; (reinforcing); &quot;I'm worthless / a failure&quot; &lt;-&gt; Dwelling on failure. Ways out: Withdraw, stop activities to Small valued action (behavioural activation)."><title>Low mood — a maintaining cycle (vicious flower)</title><desc>Maintaining loop: Low mood — a maintaining cycle (vicious flower). Links: &quot;I'm worthless / a failure&quot; -&gt; Withdraw, stop activities; Withdraw, stop activities -&gt; Fewer good experiences; Fewer good experiences -&gt; &quot;I'm worthless / a failure&quot; (reinforcing); &quot;I'm worthless / a failure&quot; &lt;-&gt; Dwelling on failure. Ways out: Withdraw, stop activities to Small valued action (behavioural activation).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="68.4" y="52" width="423.2" height="343.2" fill="#fff" /><text x="76.4" y="72" font-family="sans-serif" font-size="16" font-weight="700">Low mood — a maintaining cycle (vicious flower)</text><path d="M 383.8,270.7 L 376.2,294.3" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path d="M 292.4,355.2 L 267.6,355.2" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path d="M 255.4,317.6 L 351.8,247.4" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text data-el="edgelabel:e3" x="303.6" y="279.5" font-family="sans-serif" font-size="10" text-anchor="middle">confirms the belief</text><path d="M 351.8,172.2 L 331.8,157.6" fill="none" stroke="#000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" /><