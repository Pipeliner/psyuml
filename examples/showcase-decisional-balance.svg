<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 337" role="img" aria-label="Decisional balance 2×2: Decisional balance — thinking about leaving my job. Columns: making the change vs staying the same; rows: benefits vs costs. benefits of changing: Less daily stress, A chance to retrain, More time with family; benefits of staying: Steady income, Familiar routine, Known colleagues; costs of changing: Money uncertainty, Losing colleagues, Facing the unknown; costs of staying: Dread on Sundays, No room to grow, Health is suffering."><title>Decisional balance — thinking about leaving my job</title><desc>Decisional balance 2×2: Decisional balance — thinking about leaving my job. Columns: making the change vs staying the same; rows: benefits vs costs. benefits of changing: Less daily stress, A chance to retrain, More time with family; benefits of staying: Steady income, Familiar routine, Known colleagues; costs of changing: Money uncertainty, Losing colleagues, Facing the unknown; costs of staying: Dread on Sundays, No room to grow, Health is suffering.</desc><rect x="0" y="0" width="720" height="337" fill="#fff" /><text x="92" y="26" font-family="sans-serif" font-size="16" font-weight="700">Decisional balance — thinking about leaving my job</text><rect x="92" y="62" width="612" height="110" fill="#f3f7f3" /><rect x="92" y="172" width="612" height="110" fill="#faf4f2" /><rect x="92" y="62" width="612" height="220" fill="none" stroke="#000" stroke-width="2" /><line x1="398" y1="62" x2="398" y2="282" stroke="#000" stroke-width="1.5" /><line x1="92" y1="172" x2="704" y2="172" stroke="#000" stroke-width="1.5" /><text x="245" y="52" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Making the change</text><text x="551" y="52" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Staying the same</text><text text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700"><tspan x="48" y="109.5">Benefits /</tspan><tspan x="48" y="124.5">hopes</tspan></text><text text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700"><tspan x="48" y="219.5">Costs /</tspan><tspan x="48" y="234.5">worries</tspan></text><text data-el="nodelabel:cb1" x="245" y="88" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Less daily stress</text><text data-el="nodelabel:cb2" x="245" y="112" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">A chance to retrain</text><text data-el="nodelabel:cb3" x="245" y="136" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">More time with family</text><text data-el="nodelabel:sb1" x="551" y="88" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Steady income</text><text data-el="nodelabel:sb2" x="551" y="112" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Familiar routine</text><text data-el="nodelabel:sb3" x="551" y="136" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Known colleagues</text><text data-el="nodelabel:cc1" x="245" y="198" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Money uncertainty</text><text data-el="nodelabel:cc2" x="245" y="222" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Losing colleagues</text><text data-el="nodelabel:cc3" x="245" y="246" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Facing the unknown</text><text data-el="nodelabel:sc1" x="551" y="198" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Dread on Sundays</text><text data-el="nodelabel:sc2" x="551" y="222" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">No room to grow</text><text data-el="nodelabel:sc3" x="551" y="246" font-family="sans-serif" font-size="11" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">Health is suffering</text><text x="92" y="302" font-family="sans-serif" font-size="10" fill="#333">Use when genuinely weighing both sides — dwelling on reasons to stay can deepen ambivalence (MI-3), so it is not a persuasion tool.</text><text x="92" y="317" font-family="sans-serif" font-size="10" fill="#333">An MI reflection tool (Miller &amp; Rollnick) — a way to look at both sides honestly, held by the person whose choice it is.</text></svg>