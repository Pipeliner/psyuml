ke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e3" d="M 417.5,340.6 L 398.9,363.9" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e4" d="M 295,414 L 265,414" fill="none" stroke="#000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" /><path data-el="edge:e5" d="M 161.1,363.9 L 142.5,340.6" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e6" d="M 160.3,318.3 L 301.3,386.2" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text data-el="edgelabel:e6" x="230.8" y="349.3" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">avoidance prevents disconfirmation</text><path data-el="edge:x1" d="M 399.7,262.7 L 195.4,164.3" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><text data-el="edgelabel:x1" x="297.6" y="210.5" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">interrupt the review early (EXIT)</text><circle cx="280" cy="250" r="18" fill="#fff" stroke="#000" stroke-width="2" /><text x="280" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">R</text><rect data-el="node:event" x="210" y="46" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:event"><tspan x="280" y="65">Spoke up in the</tspan><tspan x="280" y="79">team meeting</tspan></text><rect data-el="node:selffocus" x="352.3" y="114.5" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:selffocus"><tspan x="422.3" y="133.5">Self-focused</tspan><tspan x="422.3" y="147.5">monitoring</tspan></text><rect data-el="node:postmortem" x="3