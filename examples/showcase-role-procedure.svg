<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 0 876 899" role="img" aria-label="Role procedure: Role procedure — the 'don't need' pattern (worked example). Context: Cultural norm of self-reliance. Reciprocal role pair: Unavailable, dismissing of need ⇄ Overlooked, ashamed of needing. Plane &quot;With a parent&quot;: injunction “Don't need anything”; Hide distress, mind the parent's mood; Lonely, ashamed of needing; driver “Be strong”; attribution “You're the easy one”. Plane &quot;Self to self&quot;: My needs are a burden; Ignore hunger, tiredness, pain; I mustn't be a bother; Harsh self-criticism when struggling; Observing-I: notice the dismissing voice. Plane &quot;With others&quot; (lens: Hearing loss: group talk is effortful): Over-give in friendships; ⚖ Avoid asking for help; Others don't see the struggle; presented self: Always fine, the helper. Internalized: Don't need anything → My needs are a burden; Be strong → Ignore hunger, tiredness, pain; You're the easy one → I mustn't be a bother. Links: Unavailable, dismissing of need &lt;-&gt; Overlooked, ashamed of needing; Don't need anything -&gt; Hide distress, mind the parent's mood; Hide distress, mind the parent's mood -&gt; Lonely, ashamed of needing; I mustn't be a bother -&gt; Always fine, the helper; Harsh self-criticism when struggling -&gt; Harsh self-criticism when struggling; I mustn't be a bother -&gt; Harsh self-criticism when struggling; My needs are a burden -&gt; Over-give in friendships; Over-give in friendships -&gt; Avoid asking for help; Avoid asking for help -&gt; Others don't see the struggle; Others don't see the struggle -&gt; My needs are a burden (reinforcing); Observing-I: notice the dismissing voice -&gt; Permission to ask. Ways out: Harsh self-criticism when struggling to Observing-I: notice the dismissing voice. Underlying needs: Comfort when distressed; Permission to ask; Rest. The procedure is a trap — a self-confirming loop, where actions meant to escape confirm the belief.