iticism when struggling to Observing-I: notice the dismissing voice. Underlying needs: Comfort when distressed; Permission to ask; Rest. The procedure is a trap — a self-confirming loop, where actions meant to escape confirm the belief. Interpretive (hypotheses): Avoid asking for help; Others don't see the struggle. Contested — Avoid asking for help: CAT: an enactment of the 'don't need' pole; attachment theory: a deactivating strategy. Both are held, neither is settled..</desc><defs><marker id="rp-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="4" y="0" width="876" height="899" fill="#fff" /><text x="20" y="26" font-family="sans-serif" font-size="16" font-weight="700">Role procedure — the 'don't need' pattern (worked example)</text><text x="20" y="56" font-family="sans-serif" font-size="11" fill="#333">Context: Cultural norm of self-reliance</text><text x="440" y="86" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="700" fill="#333">RECIPROCAL ROLE PAIR</text><circle cx="810" cy="95" r="16" fill="#fff" stroke="#000" stroke-width="2" /><text x="810" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">R</text><path d="M 819,129 A 9 9 0 1 1 811,122" fill="none" stroke="#000" stroke-width="2" /><path d="M 807,120 L 813,122 L 810,128 z" fill="#000" stroke="none" /><text x="810" y="157" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TRAP</text><rect data-el="band:origin" x="6" y="168" width="228" height="547" rx="8" ry="8" fill="none" stroke="#000" stroke-width="1" /><text x="120" y="185" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="700">With a parent</text><rect data-el="band:self" x="326" y="168" width="228" height="547" rx="8" ry="8" fill="none" stroke="#000" stroke-width="1" /><text x="440" y="185" font-family="sans-serif" 