anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:hide"><tspan x="120" y="319">Hide distress, mind the</tspan><tspan x="120" y="333">parent's mood</tspan></text><rect data-el="node:lonely" x="20" y="374" width="200" height="40" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="120" y="398" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:lonely">Lonely, ashamed of needing</text><rect data-el="node:burden" x="340" y="231" width="200" height="40" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="440" y="255" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:burden">My needs are a burden</text><rect data-el="node:ignore" x="340" y="445" width="200" height="42" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:ignore"><tspan x="440" y="463">Ignore hunger, tiredness,</tspan><tspan x="440" y="477">pain</tspan></text><rect data-el="node:crit" x="340" y="587" width="200" height="42" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:crit"><tspan x="440" y="605">Harsh self-criticism when</tspan><tspan x="440" y="619">struggling</tspan></text><rect data-el="node:bother" x="340" y="517" width="200" height="40" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="440" y="541" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:bother">I mustn't be a bother</text><rect data-el="node:eye" x="340" y="659" width="200" height="42" rx="20" ry="20" fill="#fff" stroke="#000" stroke-width="2" /><ellipse cx="358" cy="680" rx="9" ry="5.5" fill="none" stroke="#000" stroke-width="1.5" /><circle cx="358" cy="680" r="2.2" fill="#000" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:eye"><tspan x="440" y="677">Observing-I: notice the</tspan><tspan x="440" y="691">dismissing voice</tspan></text><rect x="655" y="512" width="210" height="50" rx="12" ry="12" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="3 3" /><rect data-el="node:fine" x="660" y="517" width="200" height="40" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="760" y="529" font-family="sans-serif" font-size="8" text-anchor="middle" font-weight="700" fill="#333">PRESENTED SELF</text><text x="760" y="547" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:fine">Always fine, the helper</text><rect data-el="node:give" x="660" y="231" width="200" height="40" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="760" y="255" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:give">Over-give in friendships</text><rect data-el="node:ask" x="660" y="302" width="200" height="40" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="5 4" /><text x="760" y="326" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:ask">⚖ Avoid asking for help</text><rect data-el="node:unseen" x="660" y="373" width="200" height="42" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="5 4" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:unseen"><tspan x="760" y="391">Others don't see the</tspan><tspan x="760" y="405">struggle</tspan></text><rect data-el="node:n1" x="169" y="757" width="170" height="40" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5" /><text x="254" y="781" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:n1">Comfort when distressed</text><rect data-el="node:n2" x="355" y="757" width="170" height="40" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5" /><text x="440" y="781" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:n2">Permission to ask</text><rect data-el="node:n3" x="541" y="757" width="170" height="40" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="1.5" /><text x="626" y="781" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:n3">Rest</text><text x="20" y="825" font-family="sans-serif" font-size="10" fill="#333">“card” = a message heard (injunction / driver / attribution) · dash-dot arrow = internalized · dotted shell = the self presented to others ·</text><text x="20" y="839" font-family="sans-serif" font-size="10" fill="#333">dashed border = interpretive (a hypothesis) · ⚖ = contested origin · dashed arrow = EXIT, a way out</text><text x="20" y="853" font-family="sans-serif" font-size="10" fill="#333">⚖ Avoid asking for help: CAT: an enactment of the 'don't need' pole; attachment theory: a deactivating strategy. Both are held, neither is</text><text x="20" y="867" font-family="sans-serif" font-size="10" fill="#333">settled.</text><text x="20" y="881" font-family="sans-serif" font-size="9" fill="#333">A worked, fictional formulation for illustration; it supports, and does not replace, professional care.</text></svg>