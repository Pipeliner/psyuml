<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 0 752 663" role="img" aria-label="Crisis navigation chart: Staying-well plan (relapse prevention). Start: &quot;Well: what keeps me steady&quot;. Steps: from &quot;Well: what keeps me steady&quot;, go to &quot;Known triggers / high-risk times&quot;; from &quot;Known triggers / high-risk times&quot;, go to &quot;Early warning signs?&quot;; from &quot;Early warning signs?&quot;, if Yes — act early go to &quot;Coping that has worked&quot;; from &quot;Coping that has worked&quot;, go to &quot;Who to tell / lean on&quot;; from &quot;Who to tell / lean on&quot;, go to &quot;Back to steady&quot;; from &quot;Early warning signs?&quot;, if No — keep going go to &quot;Back to steady&quot;. Crisis resources are always shown: In a crisis, call your local emergency number or a crisis line (use your local number)."><title>Staying-well plan (relapse prevention)</title><desc>Crisis navigation chart: Staying-well plan (relapse prevention). Start: &quot;Well: what keeps me steady&quot;. Steps: from &quot;Well: what keeps me steady&quot;, go to &quot;Known triggers / high-risk times&quot;; from &quot;Known triggers / high-risk times&quot;, go to &quot;Early warning signs?&quot;; from &quot;Early warning signs?&quot;, if Yes — act early go to &quot;Coping that has worked&quot;; from &quot;Coping that has worked&quot;, go to &quot;Who to tell / lean on&quot;; from &quot;Who to tell / lean on&quot;, go to &quot;Back to steady&quot;; from &quot;Early warning signs?&quot;, if No — keep going go to &quot;Back to steady&quot;. Crisis resources are always shown: In a crisis, call your local emergency number or a crisis line (use your local number).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="-16" y="0" width="752" height="663" fill="#fff" /><text x="20" y="22" font-family="sans-serif" font-size="16" font-weight="700">Staying-well plan (relapse prevention)</text><path data-el="edge:e1" d="M 360,89 L 360,135" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e2" d="M 360,185 L 360,231" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e3" d="M 360,281 L 360,327" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e4" d="M 360,377 L 360,423" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e5" d="M 360,473 L 360,519" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e6" d="M 360,281 L 245,281 L 245,519 L 360,519" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="360" y="308" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700" data-el="edgelabel:e3">Yes — act early</text><text x="245" y="404" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="700" data-el="edgelabel:e6">No — keep going</text><rect data-el="node:well" x="255" y="39" width="210" height="50" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="360" y="68" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:well">Well: what keeps me steady</text><polygon data-el="node:triggers" points="360,135 465,160 360,185 255,160" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:triggers"><tspan x="360" y="157">Known triggers /</tspan><tspan x="360" y="171">high-risk times</tspan></text><polygon data-el="node:warning" points="360,231 465,256 360,281 255,256" fill="#fff" stroke="#000" stroke-width="2" /><text x="360" y="260" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:warning">Early warning signs?</text><rect data-el="node:coping" x="255" y="327" width="210" height="50" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="360" y="356" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:coping">Coping that has worked</text><rect data-el="node:support" x="255" y="423" width="210" height="50" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="360" y="452" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:support">Who to tell / lean on</text><rect data-el="node:back" x="255" y="519" width="210" height="50" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="360" y="548" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:back">Back to steady</text><rect data-el="banner:crisis" x="0" y="585" width="720" height="48" fill="#fff" stroke="#000" stroke-width="2" /><text x="14" y="604" font-family="sans-serif" font-size="12" font-weight="700">Crisis resources (always available):</text><text x="14" y="622" font-family="sans-serif" font-size="11">In a crisis, call your local emergency number or a crisis line (use your local number).</text><text x="14" y="647" font-family="sans-serif" font-size="10" fill="#333">This plan supports, and does not replace, professional care. It is a wellness plan, not a crisis plan.</text></svg>