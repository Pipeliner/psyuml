0.15" stroke="#000" stroke-width="1.5" /><text x="318" y="260" font-family="sans-serif" font-size="11">Hands cold (0.4)</text><text x="12" y="454" font-family="sans-serif" font-size="10">Marker size = intensity (number shown). Body sensations are meaningful but not self-explanatory — pace and titrate.</text><text x="12" y="468" font-family="sans-serif" font-size="9" fill="#333">This map supports, and does not replace, professional care. Go slowly.</text></svg>