<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 516" role="img" aria-label="Ranked ladder: Fear ladder — agoraphobia (full showcase). Rungs, hardest first: Take a busy train across the city, alone (100); Queue inside a large supermarket at peak time (85); Sit in the middle of a row at the cinema (70); Avoided situation the client isn't ready to name (55); Walk to the local shop and back, alone (40); Stand in the front garden for five minutes (25); Open the front door and step onto the step (10). Start at the bottom; master a rung before climbing."><title>Fear ladder — agoraphobia (full showcase)</title><desc>Ranked ladder: Fear ladder — agoraphobia (full showcase). Rungs, hardest first: Take a busy train across the city, alone (100); Queue inside a large supermarket at peak time (85); Sit in the middle of a row at the cinema (70); Avoided situation the client isn't ready to name (55); Walk to the local shop and back, alone (40); Stand in the front garden for five minutes (25); Open the front door and step onto the step (10). Start at the bottom; master a rung before climbing.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="560" height="516" fill="#fff" /><text x="70" y="24" font-family="sans-serif" font-size="16" font-weight="700">Fear ladder — agoraphobia (full showcase)</text><rect data-el="node:r7" x="70" y="48" width="466" height="46" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="84" y="75" font-family="sans-serif" font-size="12" data-el="nodelabel:r7">Take a busy train across the city, alone</text><circle cx="502" cy="71" r="15" fill="none" stroke="#000" stroke-width="1.5" /><text x="502" y="75" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">100</text><rect data-el="node:r6" x="70" y="108" width="466" height="46" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="84" y="135" font-family="sans-serif" font-size="12" data-el="nodelabel:r6">Queue inside a large supermarket at peak time</text><circle cx="502" cy="131" r="15" fill="none" stroke="#000" stroke-width="1.5" /><text x="502" y="135" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">85</text><rect data-el="node:r5" x="70" y="168" width="466" height="46" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="84" y="195" font-family="sans-serif" font-size="12" data-el="nodelabel:r5">Sit in the middle of a row at the cinema</text><circle cx="502" cy="191" r="15" fill="none" stroke="#000" stroke-width="1.5" /><text x="502" y="195" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">70</text><rect data-el="node:r4" x="70" y="228" width="466" height="46" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="5 4" /><text x="84" y="255" font-family="sans-serif" font-size="12" data-el="nodelabel:r4">Avoided situation the client isn't ready to name</text><circle cx="502" cy="251" r="15" fill="none" stroke="#000" stroke-width="1.5" /><text x="502" y="255" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">55</text><rect data-el="node:r3" x="70" y="288" width="466" height="46" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="84" y="315" font-family="sans-serif" font-size="12" data-el="nodelabel:r3">Walk to the local shop and back, alone</text><circle cx="502" cy="311" r="15" fill="none" stroke="#000" stroke-width="1.5" /><text x="502" y="315" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">40</text><rect data-el="node:r2" x="70" y="348" width="466" height="46" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="84" y="375" font-family="sans-serif" font-size="12" data-el="nodelabel:r2">Stand in the front garden for five minutes</text><circle cx="502" cy="371" r="15" fill="none" stroke="#000" stroke-width="1.5" /><text x="502" y="375" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">25</text><rect data-el="node:r1" x="70" y="408" width="466" height="46" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="84" y="435" font-family="sans-serif" font-size="12" data-el="nodelabel:r1">Open the front door and step onto the step</text><circle cx="502" cy="431" r="15" fill="none" stroke="#000" stroke-width="1.5" /><text x="502" y="435" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">10</text><line x1="34" y1="462" x2="34" y2="60" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="34" y="54" font-family="sans-serif" font-size="9" text-anchor="middle">harder</text><text x="34" y="472" font-family="sans-serif" font-size="9" text-anchor="middle">easier</text><text x="70" y="490" font-family="sans-serif" font-size="11" textLength="482" lengthAdjust="spacingAndGlyphs">Climb at your own pace — master a rung before moving up; the bottom rung is where to start.</text><text x="70" y="506" font-family="sans-serif" font-size="8" fill="#333" textLength="482" lengthAdjust="spacingAndGlyphs">This map supports, and does not replace, professional care. Master a rung before climbing; consent and pacing first.</text></svg>