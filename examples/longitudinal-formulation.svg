<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" role="img" aria-label="Timeline: Longitudinal formulation — how the past shapes the present. Time: Early experiences → Core beliefs → Rules / strategies → Now (triggers). Action: Harsh criticism → Try to be perfect → Over-prepare, avoid risk → Procrastinate, then panic. Identity: &quot;I'm not safe&quot; → &quot;I'm not good enough&quot; → &quot;If I fail, I'm worthless&quot; → &quot;See — I can't cope&quot;."><title>Longitudinal formulation — how the past shapes the present</title><desc>Timeline: Longitudinal formulation — how the past shapes the present. Time: Early experiences → Core beliefs → Rules / strategies → Now (triggers). Action: Harsh criticism → Try to be perfect → Over-prepare, avoid risk → Procrastinate, then panic. Identity: &quot;I'm not safe&quot; → &quot;I'm not good enough&quot; → &quot;If I fail, I'm worthless&quot; → &quot;See — I can't cope&quot;.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="760" height="282" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">Longitudinal formulation — how the past shapes the present</text><text x="175.5" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Early experiences</text><text x="342.5" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Core beliefs</text><text x="509.5" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Rules / strategies</text><text x="676.5" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Now (triggers)</text><text x="12" y="116" font-family="sans-serif" font-size="11" font-weight="700">ACTION</text><text x="12" y="202" font-family="sans-serif" font-size="11" font-weight="700">IDENTITY</text><path data-el="edge:t1" d="M 250.5,112 L 267.5,112" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:t2" d="M 417.5,112 L 434.5,112" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:t3" d="M 584.5,112 L 601.5,112" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><rect data-el="node:a0" x="100.5" y="86" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="175.5" y="116" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:a0">Harsh criticism</text><rect data-el="node:a1" x="267.5" y="86" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="342.5" y="116" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:a1">Try to be perfect</text><rect data-el="node:a2" x="434.5" y="86" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:a2"><tspan x="509.5" y="109.5">Over-prepare, avoid</tspan><tspan x="509.5" y="122.5">risk</tspan></text><rect data-el="node:a3" x="601.5" y="86" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:a3"><tspan x="676.5" y="109.5">Procrastinate, then</tspan><tspan x="676.5" y="122.5">panic</tspan></text><rect data-el="node:i0" x="100.5" y="172" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="175.5" y="202" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:i0">&quot;I'm not safe&quot;</text><rect data-el="node:i1" x="267.5" y="172" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="342.5" y="202" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:i1">&quot;I'm not good enough&quot;</text><rect data-el="node:i2" x="434.5" y="172" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:i2"><tspan x="509.5" y="195.5">&quot;If I fail, I'm</tspan><tspan x="509.5" y="208.5">worthless&quot;</tspan></text><rect data-el="node:i3" x="601.5" y="172" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="676.5" y="202" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:i3">&quot;See — I can't cope&quot;</text><line x1="92" y1="254" x2="744" y2="254" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="92" y="248" font-family="sans-serif" font-size="11">problem-saturated past</text><text x="744" y="248" text-anchor="end" font-family="sans-serif" font-size="11">preferred future →</text></svg>