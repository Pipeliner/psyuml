t><circle cx="471.6" cy="155.1" r="34" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10"><tspan x="471.6" y="151.6">Procrastinator /</tspan><tspan x="471.6" y="164.6">scroller</tspan></text><text x="471.6" y="202.1" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#555">IFS</text><text x="340" y="334" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#333">exile</text><circle cx="340" cy="373" r="34" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10"><tspan x="340" y="369.5">&quot;Not good enough&quot;,</tspan><tspan x="340" y="382.5">age 9</tspan></text><text x="340" y="420" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#555">IFS</text><text x="20" y="482" font-family="sans-serif" font-size="11">◎ Self · ○ part · ( ) containment orbit · ═ dissociative barrier · dotted = protects · zigzag = conflict</text><text x="20" y="496" font-family="sans-serif" font-size="10" fill="#333">An illustrative, fictional composite. This map supports, and does not replace, professional care. It does not diagnose.</text></svg>