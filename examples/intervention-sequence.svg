<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" role="img" aria-label="Intervention sequence: Therapy roadmap. Lanes: Client, Therapist, Support. Steps in order: Phase 1: Stabilize (Therapist) → Grounding skills (Client) → Phase 2: Process (EMDR) (Therapist) → Witnesses / safe person (Support) → Phase 3: Integrate (Therapist) → Values-led action (Client)."><title>Therapy roadmap</title><desc>Intervention sequence: Therapy roadmap. Lanes: Client, Therapist, Support. Steps in order: Phase 1: Stabilize (Therapist) → Grounding skills (Client) → Phase 2: Process (EMDR) (Therapist) → Witnesses / safe person (Support) → Phase 3: Integrate (Therapist) → Values-led action (Client).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="720" height="570" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">Therapy roadmap</text><text x="120" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Client</text><text x="360" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Therapist</text><line x1="240" y1="62" x2="240" y2="560" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" /><text x="600" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Support</text><line x1="480" y1="62" x2="480" y2="560" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" /><path data-el="edge:e1" d="M 360,119 L 120,153" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e2" d="M 120,199 L 360,233" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="244" y="216" font-family="sans-serif" font-size="10" data-el="edgelabel:e2">[stable &amp; resourced]</text><path data-el="edge:e3" d="M 360,279 L 600,313" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e4" d="M 600,359 L 360,393" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e5" d="M 360,439 L 120,473" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><polygon data-el="node:t1" points="294,73 426,73 438,96 426,119 294,119 282,96" fill="#fff" stroke="#000" stroke-width="2" /><text x="360" y="100" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:t1">Phase 1: Stabilize</text><polygon data-el="node:c1" points="54,153 186,153 198,176 186,199 54,199 42,176" fill="#fff" stroke="#000" stroke-width="2" /><text x="120" y="180" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:c1">Grounding skills</text><polygon data-el="node:t2" points="294,233 426,233 438,256 426,279 294,279 282,256" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:t2"><tspan x="360" y="253.5">Phase 2: Process</tspan><tspan x="360" y="266.5">(EMDR)</tspan></text><polygon data-el="node:s1" points="534,313 666,313 678,336 666,359 534,359 522,336" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:s1"><tspan x="600" y="333.5">Witnesses / safe</tspan><tspan x="600" y="346.5">person</tspan></text><polygon data-el="node:t3" points="294,393 426,393 438,416 426,439 294,439 282,416" fill="#fff" stroke="#000" stroke-width="2" /><text x="360" y="420" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:t3">Phase 3: Integrate</text><polygon data-el="node:c2" points="54,473 186,473 198,496 186,519 54,519 42,496" fill="#fff" stroke="#000" stroke-width="2" /><text x="120" y="500" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:c2">Values-led action</text></svg>