<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 623.1" role="img" aria-label="Parts map: Inner system — protectors, an exile, a contested part, and Self. Self at the centre. Protectors around it: Controller / planner (manager), Pleaser (manager), Inner critic (manager), Numb-out (firefighter). Exile(s): Young hurt part, age 6, behind a dissociative barrier (&quot;dissociative barrier&quot;) from Self. Protectors guard the exile. Origins disagree on: Controller / planner (claimed by IFS and schema); Inner critic (claimed by IFS and schema); Numb-out (claimed by IFS and SD); Young hurt part, age 6 (claimed by IFS and schema and SD) — both claims are shown, not merged. How they differ — Inner critic: IFS reads it as a protector with positive intent; schema therapy as a punitive-parent mode to be limited.."><title>Inner system — protectors, an exile, a contested part, and Self</title><desc>Parts map: Inner system — protectors, an exile, a contested part, and Self. Self at the centre. Protectors around it: Controller / planner (manager), Pleaser (manager), Inner critic (manager), Numb-out (firefighter). Exile(s): Young hurt part, age 6, behind a dissociative barrier (&quot;dissociative barrier&quot;) from Self. Protectors guard the exile. Origins disagree on: Controller / planner (claimed by IFS and schema); Inner critic (claimed by IFS and schema); Numb-out (claimed by IFS and SD); Young hurt part, age 6 (claimed by IFS and schema and SD) — both claims are shown, not merged. How they differ — Inner critic: IFS reads it as a protector with positive intent; schema therapy as a punitive-parent mode to be limited..</desc><rect x="0" y="0" width="680" height="623.1" fill="#fff" /><text x="20" y="23" font-family="sans-serif" font-size="16" font-weight="700">Inner system — protectors, an exile, a contested part, and Self</text><ellipse data-el="band:containment" cx="340" cy="453.08921434720946" rx="130" ry="60" fill="none" stroke="#000" stroke-width="2" /><path data-e