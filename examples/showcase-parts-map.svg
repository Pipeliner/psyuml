ill="#333" data-el="nodelabel:critic">⚖ IFS vs schema</text><text data-el="nodelabel:numbout" x="469.8" y="255.39999999999998" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#333">firefighter</text><circle data-el="node:numbout" cx="469.8" cy="294.4" r="34" fill="#fff" stroke="#000" stroke-width="2" /><text x="469.8" y="297.4" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:numbout">Numb-out</text><text x="469.8" y="341.4" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#333" data-el="nodelabel:numbout">⚖ IFS vs SD</text><text data-el="nodelabel:exile" x="340" y="373" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#333">exile</text><circle data-el="node:exile" cx="340" cy="412" r="34" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:exile"><tspan x="340" y="408.5">Young hurt part,</tspan><tspan x="340" y="421.5">age 6</tspan></text><text x="340" y="459" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#333" data-el="nodelabel:exile">⚖ IFS vs schema vs SD</text><text x="20" y="529" font-family="sans-serif" font-size="11" textLength="640" lengthAdjust="spacingAndGlyphs">◎ Self · ○ part · ( ) containment orbit · ═ dissociative barrier · dotted = protects · zigzag = conflict</text><text x="20" y="543" font-family="sans-serif" font-size="10" fill="#333" textLength="640" lengthAdjust="spacingAndGlyphs">&quot;Parts&quot; is a working metaphor, not a claim about how the mind is built; schools disagree. Supports, does not replace, professional care.</text></svg>