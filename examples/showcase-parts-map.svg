11.3,333.7 419.2,325.1" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" /><path d="M 407.4,322.7 Q 411.3,333.7 419.2,325.1" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" /><line x1="265" y1="355.8" x2="415" y2="355.8" stroke="#000" stroke-width="2.5" /><line x1="265" y1="361.8" x2="415" y2="361.8" stroke="#000" stroke-width="2.5" /><text x="340" y="350.8" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="edgelabel:b1">dissociative barrier</text><circle data-el="node:self" cx="340" cy="264.54460717360473" r="30" fill="#fff" stroke="#000" stroke-width="2" /><circle cx="340" cy="264.54460717360473" r="23" fill="none" stroke="#000" stroke-width="2" /><circle cx="340" cy="264.54460717360473" r="4" fill="#000" /><text text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:self"><tspan x="340" y="314.5">Self (calm, curious</tspan><tspan x="340" y="329.5">core)</tspan></text><text data-el="nodelabel:controller" x="193" y="280.9" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#333">manager</text><circle data-el="node:controller" cx="193" cy="323.9" r="38" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:controller"><tspan x="193" y="320.4">Controller</tspan><tspan x="193" y="333.4">/ planner</tspan></text><text x="193" y="374.9" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#333" data-el="nodelabel:controller">⚖ IFS vs schema</text><text data-el="nodelabel:pleaser" x="243.9" y="95.5" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#333">manager</text><circle data-el="node:pleaser" cx="243.9" cy="138.5" r="38" fill="#fff" stroke="#000" stroke-width="2" /><text x="243.9" y="141.5" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:pleaser">Pleaser</text><text data-el="nodelabel:pleaser" x="243.9" y="189.5" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#555">school:IFS</text><text data-el="nodelabel:critic" x="436.1" y="95.5" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#333">manager</text><circle data-el="node:critic" cx="436.1" cy="138.5" r="38" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:critic"><tspan x="436.1" y="135">Inner</tspan><tspan x="436.1" y="148">critic</tspan></text><text x="436.1" y="189.5" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#333" data-el="nodelabel:critic">⚖ IFS vs schema</text><text data-el="nodelabel:numbout" x="487" y="280.9" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#333">firefighter</text><circle data-el="node:numbout" cx="487" cy="323.9" r="38" fill="#fff" stroke="#000" stroke-width="2" /><text x="487" y="326.9" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:numbout">Numb-out</text><text x="487" y="374.9" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#333" data-el="nodelabel:numbout">⚖ IFS vs SD</text><text data-el="nodelabel:exile" x="340" y="410.08921434720946" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#333">exile</text><circle data-el="node:exile" cx="340" cy="453.08921434720946" r="38" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:exile"><tspan x="340" y="449.6">Young hurt</tspan><tspan x="340" y="462.6">part, age 6</tspan></text><text x="340" y="504.1" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#333" data-el="nodelabel:exile">⚖ IFS vs schema vs SD</text><text x="20" y="587.1" font-family="sans-serif" font-size="10" fill="#555" textLength="640" lengthAdjust="spacingAndGlyphs">⚖ Inner critic: IFS reads it as a protector with positive intent; schema therapy as a punitive-parent mode to be limited.</text><text x="20" y="607.1" font-family="sans-serif" font-size="11" textLength="640" lengthAdjust="spacingAndGlyphs">◎ Self · ○ part · ( ) containment orbit · ═ dissociative barrier · dotted = protects · zigzag = conflict</text><text x="20" y="621.1" font-family="sans-serif" font-size="10" fill="#333" textLength="640" lengthAdjust="spacingAndGlyphs">&quot;Parts&quot; is a working metaphor, not a claim about how the mind is built; schools disagree. Supports, does not replace, professional care.</text></svg>