<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 386" role="img" aria-label="Intervention sequence: Goal ladder (solution-focused steps). Lanes: Small steps, Preferred future. Steps in order: Step 1: text one friend back (Small steps) → Step 2: a short daily walk (Small steps) → Step 3: one social plan a week (Small steps) → Connected, active, hopeful (8/10) (Preferred future)."><title>Goal ladder (solution-focused steps)</title><desc>Intervention sequence: Goal ladder (solution-focused steps). Lanes: Small steps, Preferred future. Steps in order: Step 1: text one friend back (Small steps) → Step 2: a short daily walk (Small steps) → Step 3: one social plan a week (Small steps) → Connected, active, hopeful (8/10) (Preferred future).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="720" height="386" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">Goal ladder (solution-focused steps)</text><text x="180" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Small steps</text><text x="540" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Preferred future</text><line x1="360" y1="38" x2="360" y2="376" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" /><path d="M 180,95 L 180,129" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path d="M 180,175 L 180,209" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path d="M 180,255 L 540,289" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="364" y="272" font-family="sans-serif" font-size="10" data-el="edgelabel:e3">toward</text><polygon data-el="node:s1" points="114,49 246,49 258,72 246,95 114,95 102,72" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:s1"><tspan x="180" y="69.5">Step 1: text one</tspan><tspan x="180" y="82.5">friend back</tspan></text><polygon data-el="node:s2" points="114,129 246,129 258,152 246,175 114,175 102,152" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:s2"><tspan x="180" y="149.5">Step 2: a short daily</tspan><tspan x="180" y="162.5">walk</tspan></text><polygon data-el="node:s3" points="114,209 246,209 258,232 246,255 114,255 102,232" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:s3"><tspan x="180" y="229.5">Step 3: one social</tspan><tspan x="180" y="242.5">plan a week</tspan></text><polygon data-el="node:g" points="474,289 606,289 618,312 606,335 474,335 462,312" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:g"><tspan x="540" y="309.5">Connected, active,</tspan><tspan x="540" y="322.5">hopeful (8/10)</tspan></text></svg>