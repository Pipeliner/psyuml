<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-label="Intervention sequence: Goal ladder (solution-focused steps). Lanes: Small steps, Preferred future. Steps in order: Step 1: text one friend back (Small steps) → Step 2: a short daily walk (Small steps) → Step 3: one social plan a week (Small steps) → Connected, active, hopeful (8/10) (Preferred future)."><title>Goal ladder (solution-focused steps)</title><desc>Intervention sequence: Goal ladder (solution-focused steps). Lanes: Small steps, Preferred future. Steps in order: Step 1: text one friend back (Small steps) → Step 2: a short daily walk (Small steps) → Step 3: one social plan a week (Small steps) → Connected, active, hopeful (8/10) (Preferred future).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="720" height="410" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">Goal ladder (solution-focused steps)</text><text x="180" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Small steps</text><text x="540" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Preferred future</text><line x1="360" y1="62" x2="360" y2="400" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" /><path data-el="edge:e1" d="M 180,119 L 180,153" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e2" d="M 180,199 L 180,233" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e3" d="M 180,279 L 540,313" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="364" y="296" font-family="sans-serif" font-size="10" data-el="edgelabel:e3">toward</text><polygon data-el="node:s1" points="114,73 246,73 258,96 246,119 114,119 102,96" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:s1"><tspan x="180" y="93.5">Step 1: text one</tspan><tspan x="180" y="106.5">friend back</tspan></text><polygon data-el="node:s2" points="114,153 246,153 258,176 246,199 114,199 102,176" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:s2"><tspan x="180" y="173.5">Step 2: a short daily</tspan><tspan x="180" y="186.5">walk</tspan></text><polygon data-el="node:s3" points="114,233 246,233 258,256 246,279 114,279 102,256" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:s3"><tspan x="180" y="253.5">Step 3: one social</tspan><tspan x="180" y="266.5">plan a week</tspan></text><polygon data-el="node:g" points="474,313 606,313 618,336 606,359 474,359 462,336" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:g"><tspan x="540" y="333.5">Connected, active,</tspan><tspan x="540" y="346.5">hopeful (8/10)</tspan></text></svg>