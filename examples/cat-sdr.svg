ath d="M 295,414 L 265,414" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path d="M 240.9,364 L 382.4,186.5" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text data-el="edgelabel:w_c" x="311.7" y="272.3" font-family="sans-serif" font-size="10" text-anchor="middle">confirms criticized role</text><path d="M 399.7,262.7 L 195.4,164.3" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><text data-el="edgelabel:exit" x="297.6" y="210.5" font-family="sans-serif" font-size="10" text-anchor="middle">check facts; ask early (EXIT)</text><circle cx="280" cy="250" r="18" fill="#fff" stroke="#000" stroke-width="2" /><text x="280" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">R</text><rect data-el="node:criticized" x="352.3" y="114.5" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="422.3" y="140.5" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:criticized">Me: criticized</text><rect data-el="node:placate" x="387.4" y="268.5" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="457.4" y="294.5" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:placate">Placate &amp; comply</text><rect data-el="node:resent" x="289" y="392" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:resent"><tspan x="359" y="411">Resentment &amp;</tspan><tspan x="359" y="425">exhaustion</tspan></text><rect data-el="node:withdraw" x="131" y="392" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="201" y="418" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:withdraw">Withdraw / collapse</text><rect data-el="node:critic" x="210" y="46" width=