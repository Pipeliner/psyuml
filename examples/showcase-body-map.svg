<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 507 503" role="img" aria-label="Body map: Felt sense — where the feelings live, and how strong. Sensations: Jaw clenched (intensity 0.6), Throat tight (intensity 0.5), Chest heavy (intensity 0.8), Stomach knot (intensity 0.7), Hands cold (intensity 0.3), Legs restless (intensity 0.5). Pace and titrate."><title>Felt sense — where the feelings live, and how strong</title><desc>Body map: Felt sense — where the feelings live, and how strong. Sensations: Jaw clenched (intensity 0.6), Throat tight (intensity 0.5), Chest heavy (intensity 0.8), Stomach knot (intensity 0.7), Hands cold (intensity 0.3), Legs restless (intensity 0.5). Pace and titrate.</desc><rect x="0" y="0" width="507" height="503" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">Felt sense — where the feelings live, and how strong</text><circle cx="210" cy="86" r="32" fill="#fff" stroke="#000" stroke-width="2" /><rect x="172" y="120" width="76" height="172" rx="26" ry="26" fill="#fff" stroke="#000" stroke-width="2" /><line x1="176" y1="150" x2="120" y2="258" stroke="#000" stroke-width="2" /><line x1="244" y1="150" x2="300" y2="258" stroke="#000" stroke-width="2" /><line x1="192" y1="290" x2="178" y2="436" stroke="#000" stroke-width="2" /><line x1="228" y1="290" x2="242" y2="436" stroke="#000" stroke-width="2" /><circle data-el="node:jaw" cx="230" cy="118" r="12" fill="#000" fill-opacity="0.15" stroke="#000" stroke-width="1.5" /><text x="250" y="122" font-family="sans-serif" font-size="11" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:jaw">Jaw clenched (0.6)</text><circle data-el="node:throat" cx="228" cy="160" r="11" fill="#000" fill-opacity="0.15" stroke="#000" stroke-width="1.5" /><text x="247" y="164" font-family="sans-serif" font-size="11" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:throat">Throat tight (0.5)</text><circle data-el="node:chest" cx="225" cy="215" r="14.5" fill="#000" fill-opacity="0.15" stroke="#000" stroke-width="1.5" /><text x="247.5" y="219" font-family="sans-serif" font-size="11" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:chest">Chest heavy (0.8)</text><circle data-el="node:stomach" cx="225" cy="285" r="13" fill="#000" fill-opacity="0.15" stroke="#000" stroke-width="1.5" /><text x="204" y="289" font-family="sans-serif" font-size="11" text-anchor="end" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:stomach">Stomach knot (0.7)</text><circle data-el="node:hands" cx="320" cy="290" r="9.5" fill="#000" fill-opacity="0.15" stroke="#000" stroke-width="1.5" /><text x="337.5" y="294" font-family="sans-serif" font-size="11" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:hands">Hands cold (0.3)</text><circle data-el="node:legs" cx="225" cy="420" r="10.5" fill="#000" fill-opacity="0.15" stroke="#000" stroke-width="1.5" /><text x="243.5" y="424" font-family="sans-serif" font-size="11" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:legs">Legs restless (0.5)</text><text x="12" y="454" font-family="sans-serif" font-size="10">Marker size = intensity (number shown). Body sensations are meaningful but</text><text x="12" y="466" font-family="sans-serif" font-size="10">not self-explanatory — pace and titrate.</text><text x="12" y="480" font-family="sans-serif" font-size="9" fill="#333">Go slowly; you can stop any time. Body work can stir things up. Supports, does not</text><text x="12" y="491" font-family="sans-serif" font-size="9" fill="#333">replace, professional care.</text></svg>