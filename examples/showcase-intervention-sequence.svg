<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 706" role="img" aria-label="Intervention sequence: Phased trauma therapy — who does what, in what order. Lanes: Client, Therapist, Support. Steps in order: Phase 1: Safety &amp; stabilization (Therapist) → Grounding + sleep routine (Client) → Safe person on call (Support) → Phase 2: Process the memory (EMDR / TF-CBT) (Therapist) → Window-of-tolerance skills (Client) → Phase 3: Reconnect &amp; make meaning (Therapist) → Values-led action (Client) → Peer / community group (Support)."><title>Phased trauma therapy — who does what, in what order</title><desc>Intervention sequence: Phased trauma therapy — who does what, in what order. Lanes: Client, Therapist, Support. Steps in order: Phase 1: Safety &amp; stabilization (Therapist) → Grounding + sleep routine (Client) → Safe person on call (Support) → Phase 2: Process the memory (EMDR / TF-CBT) (Therapist) → Window-of-tolerance skills (Client) → Phase 3: Reconnect &amp; make meaning (Therapist) → Values-led action (Client) → Peer / community group (Support).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="720" height="706" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">Phased trauma therapy — who does what, in what order</text><text x="120" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Client</text><text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Therapist</text><line x1="240" y1="38" x2="240" y2="696" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" /><text x="600" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Support</text><line x1="480" y1="38" x2="480" y2="696" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" /><path data-el="edge:e1" d