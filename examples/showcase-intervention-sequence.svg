12" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:t2"><tspan x="360" y="309.5">Phase 2: Process the</tspan><tspan x="360" y="322.5">memory (EMDR / TF-CBT)</tspan></text><polygon data-el="node:c2" points="54,369 186,369 198,392 186,415 54,415 42,392" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:c2"><tspan x="120" y="389.5">Window-of-tolerance</tspan><tspan x="120" y="402.5">skills</tspan></text><polygon data-el="node:t3" points="294,449 426,449 438,472 426,495 294,495 282,472" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:t3"><tspan x="360" y="469.5">Phase 3: Reconnect &amp;</tspan><tspan x="360" y="482.5">make meaning</tspan></text><polygon data-el="node:c3" points="54,529 186,529 198,552 186,575 54,575 42,552" fill="#fff" stroke="#000" stroke-width="2" /><text x="120" y="556" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:c3">Values-led action</text><polygon data-el="node:s2" points="534,609 666,609 678,632 666,655 534,655 522,632" fill="#fff" stroke="#000" stroke-width="2" /><text x="600" y="636" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:s2">Peer / community group</text></svg>