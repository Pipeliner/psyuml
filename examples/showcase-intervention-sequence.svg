<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 730" role="img" aria-label="Intervention sequence: Phased trauma therapy — who does what, in what order. Lanes: Client, Therapist, Support. Steps in order: Phase 1: Safety &amp; stabilization (Therapist) → Grounding + sleep routine (Client) → Safe person on call (Support) → Phase 2: Process the memory (EMDR / TF-CBT) (Therapist) → Window-of-tolerance skills (Client) → Phase 3: Reconnect &amp; make meaning (Therapist) → Values-led action (Client) → Peer / community group (Support)."><title>Phased trauma therapy — who does what, in what order</title><desc>Intervention sequence: Phased trauma therapy — who does what, in what order. Lanes: Client, Therapist, Support. Steps in order: Phase 1: Safety &amp; stabilization (Therapist) → Grounding + sleep routine (Client) → Safe person on call (Support) → Phase 2: Process the memory (EMDR / TF-CBT) (Therapist) → Window-of-tolerance skills (Client) → Phase 3: Reconnect &amp; make meaning (Therapist) → Values-led action (Client) → Peer / community group (Support).</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="720" height="730" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">Phased trauma therapy — who does what, in what order</text><text x="120" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Client</text><text x="360" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Therapist</text><line x1="240" y1="62" x2="240" y2="720" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" /><text x="600" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Support</text><line x1="480" y1="62" x2="480" y2="720" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" /><path data-el="edge:e1" d="M 360,119 L 120,153" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e2" d="M 120,199 L 600,233" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e3" d="M 600,279 L 360,313" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="484" y="296" font-family="sans-serif" font-size="10" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="edgelabel:e3">[stable &amp; resourced]</text><path data-el="edge:e4" d="M 360,359 L 120,393" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e5" d="M 120,439 L 360,473" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="244" y="456" font-family="sans-serif" font-size="10" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="edgelabel:e5">[distress tolerable]</text><path data-el="edge:e6" d="M 360,519 L 120,553" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e7" d="M 120,599 L 600,633" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><polygon data-el="node:t1" points="294,73 426,73 438,96 426,119 294,119 282,96" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:t1"><tspan x="360" y="93.5">Phase 1: Safety &amp;</tspan><tspan x="360" y="106.5">stabilization</tspan></text><polygon data-el="node:c1" points="54,153 186,153 198,176 186,199 54,199 42,176" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:c1"><tspan x="120" y="173.5">Grounding + sleep</tspan><tspan x="120" y="186.5">routine</tspan></text><polygon data-el="node:s1" points="534,233 666,233 678,256 666,279 534,279 522,256" fill="#fff" stroke="#000" stroke-width="2" /><text x="600" y="260" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:s1">Safe person on call</text><polygon data-el="node:t2" points="294,313 426,313 438,336 426,359 294,359 282,336" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:t2"><tspan x="360" y="333.5">Phase 2: Process the</tspan><tspan x="360" y="346.5">memory (EMDR / TF-CBT)</tspan></text><polygon data-el="node:c2" points="54,393 186,393 198,416 186,439 54,439 42,416" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:c2"><tspan x="120" y="413.5">Window-of-tolerance</tspan><tspan x="120" y="426.5">skills</tspan></text><polygon data-el="node:t3" points="294,473 426,473 438,496 426,519 294,519 282,496" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:t3"><tspan x="360" y="493.5">Phase 3: Reconnect &amp;</tspan><tspan x="360" y="506.5">make meaning</tspan></text><polygon data-el="node:c3" points="54,553 186,553 198,576 186,599 54,599 42,576" fill="#fff" stroke="#000" stroke-width="2" /><text x="120" y="580" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:c3">Values-led action</text><polygon data-el="node:s2" points="534,633 666,633 678,656 666,679 534,679 522,656" fill="#fff" stroke="#000" stroke-width="2" /><text x="600" y="660" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:s2">Peer / community group</text></svg>