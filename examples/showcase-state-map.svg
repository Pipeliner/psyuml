<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1001.7 432" role="img" aria-label="State map: Window of tolerance — a full nervous-system map. Bands top to bottom: Ventral / safe-social, Sympathetic / mobilized, Dorsal / shutdown. Transitions: Connected / playful to Anxious / fight-flight on criticism; Anxious / fight-flight to Panic surge on feeling trapped; Anxious / fight-flight to Numb / shutdown on overwhelm; Numb / shutdown to Collapse / dissociation on shame flood. Ways out: Collapse / dissociation to Numb / shutdown via orient: name five things you can see; Numb / shutdown to Anxious / fight-flight via movement / push against a wall; Anxious / fight-flight to Settled, at ease via paced breathing + call a safe person."><title>Window of tolerance — a full nervous-system map</title><desc>State map: Window of tolerance — a full nervous-system map. Bands top to bottom: Ventral / safe-social, Sympathetic / mobilized, Dorsal / shutdown. Transitions: Connected / playful to Anxious / fight-flight on criticism; Anxious / fight-flight to Panic surge on feeling trapped; Anxious / fight-flight to Numb / shutdown on overwhelm; Numb / shutdown to Collapse / dissociation on shame flood. Ways out: Collapse / dissociation to Numb / shutdown via orient: name five things you can see; Numb / shutdown to Anxious / fight-flight via movement / push against a wall; Anxious / fight-flight to Settled, at ease via paced breathing + call a safe person.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker><pattern id="p-diagonal" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="1" /></pattern><pattern id="p-cross-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#000" stroke-width="0.6" /></pattern><pattern id="p-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000" /></pattern></defs><rect x="0" y="0" width="1001.7" height="432" fill="#fff" /><text x="20" y="23" font-family="sans-serif" font-size="16" font-weight="700">Window of tolerance — a full nervous-system map</text><rect data-el="band:ventral" x="20" y="44" width="961.7" height="96" fill="#ffffff" fill-opacity="1" stroke="#000" stroke-width="2" /><text x="28" y="62" font-family="sans-serif" font-size="13" font-weight="700">Ventral / safe-social</text><rect data-el="band:sympathetic" x="20" y="150" width="961.7" height="96" fill="#ffffff" fill-opacity="1" stroke="#000" stroke-width="2" /><rect x="20" y="150" width="961.7" height="96" fill="url(#p-diagonal)" stroke="none" /><text x="28" y="168" font-family="sans-serif" font-size="13" font-weight="700">Sympathetic / mobilized</text><rect data-el="band:dorsal" x="20" y="256" width="961.7" height="96" fill="#ffffff" fill-opacity="1" stroke="#000" stroke-width="2" /><rect x="20" y="256" width="961.7" height="96" fill="url(#p-cross-hatch)" stroke="none" /><text x="28" y="274" font-family="sans-serif" font-size="13" font-weight="700">Dorsal / shutdown</text><path data-el="edge:e1" d="M 473.3,112 L 473.3,178" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e2" d="M 583.3,198 H 879.3 V 198 H 833.3" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e3" d="M 473.3,218 L 473.3,284" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e4" d="M 583.3,304 H 879.3 V 304 H 833.3" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:x1" d="M 613.3,304 H 317.3 V 304 H 363.3" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><path data-el="edge:x2" d="M 363.3,304 H 317.3 V 198 H 363.3" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><path data-el="edge:x3" d="M 520.5,178 L 676.1,112" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><text data-el="edgelabel:e2" x="887.3" y="194" font-family="sans-serif" font-size="12" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke">feeling trapped</text><text data-el="edgelabel:e4" x="887.3" y="300" font-family="sans-serif" font-size="12" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke">shame flood</text><text data-el="edgelabel:x1" x="309.3" y="300" font-family="sans-serif" font-size="12" text-anchor="end" stroke="#fff" stroke-width="3" paint-order="stroke">orient: name five things you can see (EXIT)</text><text data-el="edgelabel:x2" x="309.3" y="247" font-family="sans-serif" font-size="12" text-anchor="end" stroke="#fff" stroke-width="3" paint-order="stroke">movement / push against a wall (EXIT)</text><text data-el="edgelabel:e1" x="473.3" y="135" font-family="sans-serif" font-size="12" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">criticism</text><text data-el="edgelabel:x3" x="598.3" y="155" font-family="sans-serif" font-size="12" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">paced breathing + call a safe person (EXIT)</text><text data-el="edgelabel:e3" x="473.3" y="251" font-family="sans-serif" font-size="12" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">overwhelm</text><rect data-el="node:connected" x="363.3" y="72" width="220" height="40" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="473.3" y="96" font-family="sans-serif" font-size="12" text-anchor="middle" data-el="nodelabel:connected">Connected / playful</text><rect data-el="node:settled" x="613.3" y="72" width="220" height="40" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="723.3" y="96" font-family="sans-serif" font-size="12" text-anchor="middle" data-el="nodelabel:settled">Settled, at ease</text><rect data-el="node:anxious" x="363.3" y="178" width="220" height="40" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="473.3" y="202" font-family="sans-serif" font-size="12" text-anchor="middle" data-el="nodelabel:anxious">Anxious / fight-flight</text><rect data-el="node:panic" x="613.3" y="178" width="220" height="40" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="723.3" y="202" font-family="sans-serif" font-size="12" text-anchor="middle" data-el="nodelabel:panic">Panic surge</text><rect data-el="node:numb" x="363.3" y="284" width="220" height="40" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="473.3" y="308" font-family="sans-serif" font-size="12" text-anchor="middle" data-el="nodelabel:numb">Numb / shutdown</text><rect data-el="node:collapse" x="613.3" y="284" width="220" height="40" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="723.3" y="308" font-family="sans-serif" font-size="12" text-anchor="middle" data-el="nodelabel:collapse">Collapse / dissociation</text><line x1="28" y1="382" x2="60" y2="382" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="68" y="386" font-family="sans-serif" font-size="11">transition (what leads here)</text><line x1="28" y1="402" x2="60" y2="402" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><text x="68" y="406" font-family="sans-serif" font-size="11">exit — a way out</text><text x="320" y="386" font-family="sans-serif" font-size="11">Bands are ordered top → bottom; patterns (not colour) mark the zones.</text><text x="320" y="406" font-family="sans-serif" font-size="10" fill="#333">This map supports, and does not replace, professional care. Co-created; it is a shared picture, not a diagnosis.</text></svg>