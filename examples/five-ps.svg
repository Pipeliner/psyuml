<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" role="img" aria-label="Timeline: The 5 Ps (shown as a factor timeline; by nature a grid). Time: Predisposing → Precipitating → Perpetuating → Protective. Action: Early adversity; temperament → Recent loss; work stress → Avoidance; rumination → Supportive partner; insight. Identity: Presenting: low mood, anxiety."><title>The 5 Ps (shown as a factor timeline; by nature a grid)</title><desc>Timeline: The 5 Ps (shown as a factor timeline; by nature a grid). Time: Predisposing → Precipitating → Perpetuating → Protective. Action: Early adversity; temperament → Recent loss; work stress → Avoidance; rumination → Supportive partner; insight. Identity: Presenting: low mood, anxiety.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="760" height="282" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">The 5 Ps (shown as a factor timeline; by nature a grid)</text><text x="175.5" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Predisposing</text><text x="342.5" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Precipitating</text><text x="509.5" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Perpetuating</text><text x="676.5" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700">Protective</text><text x="12" y="116" font-family="sans-serif" font-size="11" font-weight="700">ACTION</text><text x="12" y="202" font-family="sans-serif" font-size="11" font-weight="700">IDENTITY</text><path data-el="edge:t1" d="M 250.5,112 L 267.5,112" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:t2" d="M 417.5,112 L 434.5,112" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:t3" d="M 584.5,112 L 601.5,112" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><rect data-el="node:p0" x="100.5" y="86" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:p0"><tspan x="175.5" y="109.5">Early adversity;</tspan><tspan x="175.5" y="122.5">temperament</tspan></text><rect data-el="node:p1" x="267.5" y="86" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:p1"><tspan x="342.5" y="109.5">Recent loss; work</tspan><tspan x="342.5" y="122.5">stress</tspan></text><rect data-el="node:p2" x="434.5" y="86" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text x="509.5" y="116" font-family="sans-serif" font-size="10" text-anchor="middle" data-el="nodelabel:p2">Avoidance; rumination</text><rect data-el="node:p3" x="601.5" y="86" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:p3"><tspan x="676.5" y="109.5">Supportive partner;</tspan><tspan x="676.5" y="122.5">insight</tspan></text><rect data-el="node:pp" x="267.5" y="172" width="150" height="52" rx="8" ry="8" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" data-el="nodelabel:pp"><tspan x="342.5" y="195.5">Presenting: low mood,</tspan><tspan x="342.5" y="208.5">anxiety</tspan></text><line x1="92" y1="254" x2="744" y2="254" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="92" y="248" font-family="sans-serif" font-size="11">problem-saturated past</text><text x="744" y="248" text-anchor="end" font-family="sans-serif" font-size="11">preferred future →</text></svg>