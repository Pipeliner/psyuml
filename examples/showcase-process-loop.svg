<svg xmlns="http://www.w3.org/2000/svg" viewBox="56.9 26 446.2 420" role="img" aria-label="Maintaining loop: Health-anxiety maintenance cycle — a trap with a way out. Links: Notices a body sensation -&gt; &quot;Something is seriously wrong&quot;; &quot;Something is seriously wrong&quot; &lt;-&gt; Anxiety spikes; Anxiety spikes -&gt; Checks, Googles, seeks reassurance; Checks, Googles, seeks reassurance -&gt; Brief relief; Brief relief -&gt; Notices a body sensation (reinforcing). Ways out: Checks, Googles, seeks reassurance to Postpone checking; allow doubt. This maintaining pattern is a trap — a self-confirming loop, where actions meant to escape confirm the belief. Confidence — medium: &quot;Something is seriously wrong&quot;."><title>Health-anxiety maintenance cycle — a trap with a way out</title><desc>Maintaining loop: Health-anxiety maintenance cycle — a trap with a way out. Links: Notices a body sensation -&gt; &quot;Something is seriously wrong&quot;; &quot;Something is seriously wrong&quot; &lt;-&gt; Anxiety spikes; Anxiety spikes -&gt; Checks, Googles, seeks reassurance; Checks, Googles, seeks reassurance -&gt; Brief relief; Brief relief -&gt; Notices a body sensation (reinforcing). Ways out: Checks, Googles, seeks reassurance to Postpone checking; allow doubt. This maintaining pattern is a trap — a self-confirming loop, where actions meant to escape confirm the belief. Confidence — medium: &quot;Something is seriously wrong&quot;.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="56.9" y="26" width="446.2" height="420" fill="#fff" /><text x="64.9" y="46" font-family="sans-serif" font-size="16" font-weight="700">Health-anxiety maintenance cycle — a trap with a way out</text><path data-el="edge:e1" d="M 415.1,236 L 415.1,264" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text data-el="edgelabel:e1" x="415.1" y="247" font-family="sans-serif" font-size="10" text-anchor="middle">a twinge or skipped beat</text><path data-el="edge:e2" d="M 359.7,360 L 335.4,374" fill="none" stroke="#000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" /><path data-el="edge:e3" d="M 224.6,374 L 200.3,360" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e4" d="M 144.9,264 L 144.9,236" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:e5" d="M 208.9,172 L 351.1,172" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><path data-el="edge:x1" d="M 176.9,272.6 L 248,149.4" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><text data-el="edgelabel:x1" x="212.5" y="208" font-family="sans-serif" font-size="10" text-anchor="middle">drop the safety behaviour (EXIT)</text><circle cx="280" cy="250" r="18" fill="#fff" stroke="#000" stroke-width="2" /><text x="280" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">R</text><path d="M 289,284 A 9 9 0 1 1 281,277" fill="none" stroke="#000" stroke-width="2" /><path d="M 277,275 L 283,277 L 280,283 z" fill="#000" stroke="none" /><text x="280" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TRAP</text><rect data-el="node:sensation" x="345.1" y="150" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:sensation"><tspan x="415.1" y="169">Notices a body</tspan><tspan x="415.1" y="183">sensation</tspan></text><rect data-el="node:appraise" x="345.1" y="306" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:appraise"><tspan x="415.1" y="325">&quot;Something is</tspan><tspan x="415.1" y="339">seriously wrong&quot;</tspan></text><rect data-el="node:anxiety" x="210" y="384" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="280" y="410" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:anxiety">Anxiety spikes</text><rect data-el="node:checking" x="74.9" y="306" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:checking"><tspan x="144.9" y="325">Checks, Googles,</tspan><tspan x="144.9" y="339">seeks reassurance</tspan></text><rect data-el="node:relief" x="74.9" y="150" width="140" height="44" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="144.9" y="176" font-family="sans-serif" font-size="11" text-anchor="middle" data-el="nodelabel:relief">Brief relief</text><polygon data-el="node:wayout" points="280,72 350,94 280,116 210,94" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="11" data-el="nodelabel:wayout"><tspan x="280" y="91">Postpone checking;</tspan><tspan x="280" y="105">allow doubt</tspan></text></svg>