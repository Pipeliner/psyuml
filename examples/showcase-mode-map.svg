<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-label="Schema mode map: Schema modes — the inner cast and the Healthy Adult. Modes by dominance: Punitive Parent 0.60, Angry Child 0.50, Compliant Surrenderer 0.40, Vulnerable Child 0.85, Detached Protector 0.70, Healthy Adult 0.30. Triggers: Punitive Parent (attacks) -&gt; Vulnerable Child; Angry Child (then numbs out) -&gt; Detached Protector; Compliant Surrenderer (yields) -&gt; Healthy Adult; Vulnerable Child (activates) -&gt; Detached Protector; Healthy Adult (negotiates with) -&gt; Detached Protector. Goal: grow the Healthy Adult."><title>Schema modes — the inner cast and the Healthy Adult</title><desc>Schema mode map: Schema modes — the inner cast and the Healthy Adult. Modes by dominance: Punitive Parent 0.60, Angry Child 0.50, Compliant Surrenderer 0.40, Vulnerable Child 0.85, Detached Protector 0.70, Healthy Adult 0.30. Triggers: Punitive Parent (attacks) -&gt; Vulnerable Child; Angry Child (then numbs out) -&gt; Detached Protector; Compliant Surrenderer (yields) -&gt; Healthy Adult; Vulnerable Child (activates) -&gt; Detached Protector; Healthy Adult (negotiates with) -&gt; Detached Protector. Goal: grow the Healthy Adult.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker></defs><rect x="0" y="0" width="780" height="480" fill="#fff" /><text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="700">Schema modes — the inner cast and the Healthy Adult</text><path data-el="edge:m1" d="M 160,114.8 L 160,278.2" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" /><text data-el="edgelabel:m1" x="160" y="193.5" text-anchor="middle" font-family="sans-serif" font-size="9" stroke="#fff" stroke-width="3" paint-order="stroke">attacks</text><path data-el="edge:m2" d="M 410,112 L 410,282.4" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" /><text data-el="edgelabel:m2" x="410" y="194.2" text-anchor="middle" font-family="sans-serif" font-size="9" stroke="#fff" stroke-width="3" paint-order="stroke">then numbs out</text><path data-el="edge:m3" d="M 660,109.2 L 660,293.6" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" /><text data-el="edgelabel:m3" x="660" y="198.4" text-anchor="middle" font-family="sans-serif" font-size="9" stroke="#fff" stroke-width="3" paint-order="stroke">yields</text><path data-el="edge:m4" d="M 201.8,320 L 372.4,320" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" /><text data-el="edgelabel:m4" x="287.1" y="317" text-anchor="middle" font-family="sans-serif" font-size="9" stroke="#fff" stroke-width="3" paint-order="stroke">activates</text><path data-el="edge:m5" d="M 633.6,320 L 447.6,320" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" /><text data-el="edgelabel:m5" x="540.6" y="317" text-anchor="middle" font-family="sans-serif" font-size="9" stroke="#fff" stroke-width="3" paint-order="stroke">negotiates with</text><circle data-el="node:punitive" cx="160" cy="80" r="34.8" fill="#fff" stroke="#000" stroke-width="2" /><text x="160" y="128.8" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:punitive">Punitive Parent</text><text data-el="nodelabel:punitive" x="160" y="142.8" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">dom 0.60</text><circle data-el="node:angry" cx="410" cy="80" r="32" fill="#fff" stroke="#000" stroke-width="2" /><polygon points="410,35 418,47 402,47" fill="#fff" stroke="#000" stroke-width="1.5" /><text x="410" y="126" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:angry">Angry Child</text><text data-el="nodelabel:angry" x="410" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">dom 0.50</text><circle data-el="node:compliant" cx="660" cy="80" r="29.2" fill="#fff" stroke="#000" stroke-width="2" /><text text-anchor="middle" font-family="sans-serif" font-size="10" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:compliant"><tspan x="660" y="123.2">Compliant</tspan><tspan x="660" y="136.2">Surrenderer</tspan></text><text data-el="nodelabel:compliant" x="660" y="150.2" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">dom 0.40</text><circle data-el="node:vchild" cx="160" cy="320" r="41.8" fill="#fff" stroke="#000" stroke-width="2" /><polygon points="160,265.2 168,277.2 152,277.2" fill="#fff" stroke="#000" stroke-width="1.5" /><text x="160" y="375.8" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:vchild">Vulnerable Child</text><text data-el="nodelabel:vchild" x="160" y="389.8" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">dom 0.85</text><circle data-el="node:detached" cx="410" cy="320" r="37.6" fill="#fff" stroke="#000" stroke-width="2" /><text x="410" y="371.6" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:detached">Detached Protector</text><text data-el="nodelabel:detached" x="410" y="385.6" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">dom 0.70</text><circle data-el="node:healthy" cx="660" cy="320" r="26.4" fill="#fff" stroke="#000" stroke-width="2" /><circle cx="660" cy="320" r="22.4" fill="none" stroke="#000" stroke-width="2" /><text x="660" y="287.6" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" stroke="#fff" stroke-width="3" paint-order="stroke">↑ grow</text><text x="660" y="360.4" font-family="sans-serif" font-size="10" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" data-el="nodelabel:healthy">Healthy Adult</text><text data-el="nodelabel:healthy" x="660" y="374.4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#555" stroke="#fff" stroke-width="2.5" paint-order="stroke">dom 0.30</text><text x="12" y="456" font-family="sans-serif" font-size="10">Circle size = mode dominance (number shown). Goal: grow the Healthy Adult, shrink maladaptive modes.</text><text x="12" y="470" font-family="sans-serif" font-size="9" fill="#333">A shared map of recurring 'modes', not a diagnosis. Supports, does not replace, professional care.</text></svg>