<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" role="img" aria-label="State map: R. — nervous-system ladder. Bands top to bottom: Ventral / safe-social, Sympathetic / mobilized, Dorsal / shutdown. Transitions: Calm / connected to Anxious / fight-flight on criticism; Anxious / fight-flight to Numb / shutdown on overwhelm. Ways out: Numb / shutdown to Anxious / fight-flight via movement / orienting; Anxious / fight-flight to Calm / connected via paced breathing / co-regulation."><title>R. — nervous-system ladder</title><desc>State map: R. — nervous-system ladder. Bands top to bottom: Ventral / safe-social, Sympathetic / mobilized, Dorsal / shutdown. Transitions: Calm / connected to Anxious / fight-flight on criticism; Anxious / fight-flight to Numb / shutdown on overwhelm. Ways out: Numb / shutdown to Anxious / fight-flight via movement / orienting; Anxious / fight-flight to Calm / connected via paced breathing / co-regulation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#000" /></marker><pattern id="p-diagonal" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="1" /></pattern><pattern id="p-cross-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#000" stroke-width="0.6" /></pattern><pattern id="p-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000" /></pattern></defs><rect x="0" y="0" width="680" height="432" fill="#fff" /><text x="20" y="23" font-family="sans-serif" font-size="16" font-weight="700">R. — nervous-system ladder</text><rect x="20" y="44" width="640" height="96" fill="#ffffff" fill-opacity="1" stroke="#000" stroke-width="2" /><text x="28" y="62" font-family="sans-serif" font-size="13" font-weight="700">Ventral / safe-social</text><rect x="20" y="150" width="640" height="96" fill="#ffffff" fill-opacity="1" stroke="#000" stroke-width="2" /><rect x="20" y="150" width="640" height="96" fill="url(#p-diagonal)" stroke="none" /><text x="28" y="168" font-family="sans-serif" font-size="13" font-weight="700">Sympathetic / mobilized</text><rect x="20" y="256" width="640" height="96" fill="#ffffff" fill-opacity="1" stroke="#000" stroke-width="2" /><rect x="20" y="256" width="640" height="96" fill="url(#p-cross-hatch)" stroke="none" /><text x="28" y="274" font-family="sans-serif" font-size="13" font-weight="700">Dorsal / shutdown</text><path d="M 450,92 H 640 V 198 H 450" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="632" y="141" font-family="sans-serif" font-size="11" text-anchor="end">criticism</text><path d="M 450,198 H 640 V 304 H 450" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="632" y="247" font-family="sans-serif" font-size="11" text-anchor="end">overwhelm</text><path d="M 230,304 H 40 V 198 H 230" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><text x="48" y="247" font-family="sans-serif" font-size="11" text-anchor="start">movement / orienting (EXIT)</text><path d="M 230,198 H 40 V 92 H 230" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><text x="48" y="141" font-family="sans-serif" font-size="11" text-anchor="start">paced breathing / co-regulation (EXIT)</text><rect x="230" y="72" width="220" height="40" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="340" y="96" font-family="sans-serif" font-size="12" text-anchor="middle">Calm / connected</text><rect x="230" y="178" width="220" height="40" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="340" y="202" font-family="sans-serif" font-size="12" text-anchor="middle">Anxious / fight-flight</text><rect x="230" y="284" width="220" height="40" rx="10" ry="10" fill="#fff" stroke="#000" stroke-width="2" /><text x="340" y="308" font-family="sans-serif" font-size="12" text-anchor="middle">Numb / shutdown</text><line x1="28" y1="382" x2="60" y2="382" stroke="#000" stroke-width="2" marker-end="url(#arrow)" /><text x="68" y="386" font-family="sans-serif" font-size="11">transition (what leads here)</text><line x1="28" y1="402" x2="60" y2="402" stroke="#000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" /><text x="68" y="406" font-family="sans-serif" font-size="11">exit — a way out</text><text x="320" y="386" font-family="sans-serif" font-size="11">Bands are ordered top → bottom; patterns (not colour) mark the zones.</text><text x="320" y="406" font-family="sans-serif" font-size="10" fill="#333">This map supports, and does not replace, professional care.</text></svg>