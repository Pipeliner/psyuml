name: SDD check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sdd:
    name: Spec-Driven Development harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run SDD harness checker
        run: node sdd/check.mjs
