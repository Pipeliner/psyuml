<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Phase or arousal band glyph">
  <title>Phase / arousal band (ordered zone, pattern not hue)</title>
  <defs>
    <pattern id="band" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="1" />
    </pattern>
  </defs>
  <rect x="6" y="24" width="52" height="16" fill="url(#band)" stroke="#000" stroke-width="2" />
</svg>
